/* ================== vencimiento: fijo o periódico ======================== */
/* La casilla «Cumplimiento periódico» cambia la fecha suelta por un calendario
   de días del mes. Elegido el día, el vencimiento se calcula solo y se vuelve
   a calcular en cada ciclo.                                                  */
function PlazoCumplimiento({ f, set, full }) {
  const per = esPeriodico(f);
  const dia = f.dia_mes || "";

  function alternar(marcado) {
    if (marcado) {
      const d = dia || String(new Date().getDate());
      set("periodico", "Sí");
      set("dia_mes", d);
      set("fecha_plazo", proximaFecha(d));
    } else {
      set("periodico", "");
      set("dia_mes", "");
    }
  }
  function elegir(d) {
    set("dia_mes", String(d));
    set("fecha_plazo", proximaFecha(d));
  }

  return (
    <div className={full ? "full" : ""}>
      <label className="f">Fecha de vencimiento del cumplimiento</label>

      <label className="chk">
        <input type="checkbox" checked={per} onChange={(e) => alternar(e.target.checked)} />
        <span>Cumplimiento periódico <small>se repite el mismo día de cada mes</small></span>
      </label>

      {!per ? (
        <input type="date" value={dISO(f.fecha_plazo)} onChange={(e) => set("fecha_plazo", e.target.value)} />
      ) : (
        <div className="calmes">
          <div className="calcab">Elija el día del mes en que vence</div>
          <div className="caldias">
            {Array.from({ length: 31 }, (_, k) => k + 1).map((d) => (
              <button key={d} type="button"
                className={"caldia" + (String(dia) === String(d) ? " sel" : "")}
                onClick={() => elegir(d)}>{d}</button>
            ))}
          </div>
          <button type="button"
            className={"caldia ultimo" + (String(dia) === DIA_ULTIMO ? " sel" : "")}
            onClick={() => elegir(DIA_ULTIMO)}>Último día del mes</button>
          {dia ? (
            <div className="calpie">
              Vence el <b>{rotuloDia(dia)}</b>. Próximo vencimiento: <b>{fmt(f.fecha_plazo)}</b>.
              {String(dia) !== DIA_ULTIMO && +dia > 28 &&
                <div style={{ marginTop: 4 }}>En los meses más cortos se corre al último día disponible.</div>}
            </div>
          ) : <div className="calpie">Todavía no ha elegido el día.</div>}
        </div>
      )}
    </div>
  );
}

/* ========================= vista: reporte ejecutivo ======================= */
/* Arma un informe con la identidad del sistema y lo entrega en PDF a través
   del cuadro de impresión del navegador: no depende de ninguna librería
   externa, así que funciona igual en una oficina con la red restringida.    */
/* ================== recordatorio diario de pendientes ==================== */
/* Un solo renglón dentro de la barra azul: se ve en cualquier sección, no le
   quita sitio al contenido y resume en un vistazo lo que aprieta hoy. La
   carita y el parpadeo salen de la escala de urgencia: cuanto menos tiempo
   queda, más triste la cara y más rápida la intermitencia.                  */
function AvisoDiario({ ev, alerta, cerrado, setCerrado, onIr, onAvances, onRecordatorios }) {
  const d = useMemo(() => {
    const pend = ev.filter((x) => x.r.estado !== "Resuelto");
    return {
      pend,
      vencidos: pend.filter((x) => x.e.s === "vencido"),
      hoyv: pend.filter((x) => x.e.rest === 0),
      pronto: pend.filter((x) => x.e.rest > 0 && x.e.rest <= alerta),
      avances: pend.filter((x) => pideAvance(x.r, x.e)),
      correos: pend.filter((x) => puedeRecordar(x.r, x.e, alerta)),
    };
  }, [ev, alerta]);

  if (cerrado) return null;

  const apremia = d.vencidos.length + d.hoyv.length + d.pronto.length + d.avances.length + d.correos.length;
  const peor = d.pend.reduce((mx, x) => Math.max(mx, urgencia(x.e).n), 0);
  const u = ESCALA[apremia ? peor : 0];
  const fuerte = u.n >= 4;
  const anim = u.vel ? { "--vel": u.vel + "s" } : null;

  const titulo = !apremia
    ? "Todo al día"
    : d.vencidos.length
      ? d.vencidos.length + (d.vencidos.length === 1 ? " requerimiento vencido" : " requerimientos vencidos")
      : d.hoyv.length ? "Hay cumplimientos que vencen hoy" : "Hay vencimientos cerca";

  const detalle = !apremia
    ? "Ningún requerimiento vencido ni próximo a vencer. " + d.pend.length + " pendientes en curso."
    : "Recordatorio del " + new Date().toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long" }) +
      " · " + d.pend.length + " pendientes en total";

  const pastilla = (n, l, color, fn, pulsa) => n ? (
    <button className={"past" + (pulsa ? " pulsa" + (fuerte && pulsa === 2 ? " fuerte" : "") : "")}
      style={{ background: color, borderColor: color, ...(pulsa ? { "--vel": (pulsa === 2 ? 0.7 : 1.8) + "s" } : {}) }}
      onClick={fn} title={l}>
      <span className="n">{n}</span>{l}
    </button>
  ) : null;

  return (
    <div className="aviso" style={{ "--tono": u.c }}>
      <span className={"cara" + (u.vel ? " pulsa" : "")} style={anim} role="img" aria-label={u.l}>{u.cara}</span>
      <div className="txt">
        <b>{titulo}</b>
        <span>{detalle}</span>
      </div>
      <div className="pastillas">
        {pastilla(d.vencidos.length, "vencidos", SEM.vencido.c, () => onIr("vencido"), 2)}
        {pastilla(d.hoyv.length, "vencen hoy", "#E0741A", () => onIr("porvencer"), 2)}
        {pastilla(d.pronto.length, "por vencer", SEM.porvencer.c, () => onIr("porvencer"), 1)}
        {pastilla(d.avances.length, "piden avance", T.navy3, onAvances, 1)}
        {pastilla(d.correos.length, "por recordar", "#6B4C9A", onRecordatorios, 1)}
        <button className="cerrar" onClick={() => setCerrado(true)} title="Ocultar hasta la próxima apertura">✕</button>
      </div>
    </div>
  );
}

/* ========================= avatar flotante del chat ======================= */
/* Mismo criterio de urgencia que el recordatorio de la barra superior, pero
   siempre visible como un mascoteo fijo en la esquina inferior derecha. Se
   agita cuando hay algo que atender y, al pulsarlo, abre la lista de lo que
   está pendiente de gestionar con mensajes en pantalla (nada se envía solo). */
function AvatarFlotante({ pend, alerta, onIr, onAvances, onRecordatorios, onVerFicha }) {
  const [abierto, setAbierto] = useState(false);

  const resumen = useMemo(() => ({
    vencidos: pend.filter((x) => x.e.s === "vencido"),
    hoyv: pend.filter((x) => x.e.rest === 0),
    pronto: pend.filter((x) => x.e.rest > 0 && x.e.rest <= alerta),
    avances: pend.filter((x) => pideAvance(x.r, x.e)),
    correos: pend.filter((x) => puedeRecordar(x.r, x.e, alerta)),
  }), [pend, alerta]);

  const apremia = resumen.vencidos.length + resumen.hoyv.length + resumen.pronto.length
    + resumen.avances.length + resumen.correos.length;
  const peor = pend.reduce((mx, x) => Math.max(mx, urgencia(x.e).n), 0);
  const u = ESCALA[apremia ? peor : 0];
  const agita = u.n >= 2;

  const titulo = !pend.length
    ? "Sin pendientes"
    : !apremia
      ? "Todo al día"
      : apremia + (apremia === 1 ? " cumplimiento por gestionar" : " cumplimientos por gestionar");

  return (
    <div className="avflot">
      {abierto && (
        <div className="avpanel" style={{ "--tono": u.c }}>
          <div className="avpanel-cab">
            <b><span className="caraf">{u.cara}</span>{titulo}</b>
            <button className="cerrar" onClick={() => setAbierto(false)} title="Cerrar">✕</button>
          </div>
          <div className="avpanel-cuerpo">
            {!pend.length && (
              <p className="avvacio">No hay requerimientos pendientes de gestionar.</p>
            )}
            {pend.slice(0, 12).map(({ i, r, e }) => {
              const uu = urgencia(e);
              return (
                <button key={i} className="avitemf" style={{ "--tono": uu.c }}
                  onClick={() => { setAbierto(false); onVerFicha(r.consecutivo); }}>
                  <span className="caraf">{uu.cara}</span>
                  <span className="txt">
                    <b>{r.asunto || "(sin asunto)"}</b>
                    <small>{r.consecutivo || "s/c"} · {r.area || "sin área"} · {uu.l}</small>
                  </span>
                </button>
              );
            })}
            {pend.length > 12 && <div className="avmas">y {pend.length - 12} más…</div>}
          </div>
          {apremia > 0 && (
            <div className="avpanel-pie">
              {resumen.vencidos.length > 0 && (
                <button className="btn mini" onClick={() => { setAbierto(false); onIr("vencido"); }}>
                  Vencidos ({resumen.vencidos.length})
                </button>
              )}
              {(resumen.hoyv.length > 0 || resumen.pronto.length > 0) && (
                <button className="btn mini" onClick={() => { setAbierto(false); onIr("porvencer"); }}>
                  Por vencer ({resumen.hoyv.length + resumen.pronto.length})
                </button>
              )}
              {resumen.avances.length > 0 && (
                <button className="btn mini oro" onClick={() => { setAbierto(false); onAvances(); }}>
                  Reportar avance ({resumen.avances.length})
                </button>
              )}
              {resumen.correos.length > 0 && (
                <button className="btn mini azul" onClick={() => { setAbierto(false); onRecordatorios(); }}>
                  Recordar por correo ({resumen.correos.length})
                </button>
              )}
            </div>
          )}
        </div>
      )}
      <button type="button" className={"avboton" + (agita ? " agita" : "")}
        style={{ "--tono": u.c, "--vel": (u.vel || 1.4) + "s" }}
        onClick={() => setAbierto((v) => !v)}
        title={apremia ? apremia + " pendientes por gestionar" : "Todo al día · abrir el asistente"}>
        <img src={window.AVATAR_CHAT} alt="Asistente de cumplimientos" />
        {apremia > 0 && <span className="avbadge">{apremia > 99 ? "99+" : apremia}</span>}
      </button>
    </div>
  );
}

/* ============ avances de los cumplimientos periódicos (15 días) ========== */
/* Quince días antes del vencimiento la aplicación pide por escrito cómo va el
   cumplimiento. Cada avance queda fechado, firmado y guardado en la misma
   fila del Excel, de modo que después se puede imprimir en la ficha.       */
function ModalAvances({ lista, alerta, onCerrar, onGuardar }) {
  const [txt, setTxt] = useState({});
  const set = (c, v) => setTxt((p) => ({ ...p, [c]: v }));

  return (
    <div className="modal" onClick={onCerrar}>
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <div className="cab">
          <h2>Avance de los cumplimientos mensuales</h2>
          <button className="btn claro mini" onClick={onCerrar}>Cerrar</button>
        </div>
        <div className="cuerpo">
          <p style={{ fontSize: 13, color: T.muted, lineHeight: 1.6, marginTop: 0 }}>
            Estos cumplimientos periódicos vencen dentro de {AVISO_PERIODICO} días o menos y todavía
            no tienen avance reportado en este ciclo. Escriba en qué va cada uno: el texto queda
            fechado y firmado, y sale impreso en la ficha del requerimiento.
          </p>
          <div className="avlista">
            {lista.map(({ i, r, e }) => {
              const u = urgencia(e);
              const hist = lineasAvance(r);
              return (
                <div className="avitem" key={i} style={{ "--tono": u.c }}>
                  <div className="avcab">
                    <div style={{ minWidth: 0 }}>
                      <b><span className="caraf">{u.cara}</span>{r.asunto || "(sin asunto)"}</b>
                      <div className="cua">{r.consecutivo} · {r.area || "sin área"} · {rotuloDia(r.dia_mes)}</div>
                    </div>
                    <div style={{ textAlign: "right", color: u.c, fontWeight: 700, fontSize: 12.5 }}>
                      {e.motivo}
                      <div className="cua" style={{ color: T.muted }}>vence {fmt(r.fecha_plazo)}</div>
                    </div>
                  </div>
                  <textarea value={txt[r.consecutivo] || ""} onChange={(ev) => set(r.consecutivo, ev.target.value)}
                    placeholder="¿Qué se ha adelantado? ¿Qué falta? ¿Quién lo tiene?" />
                  <div className="row" style={{ marginTop: 8 }}>
                    <button className="btn mini oro" disabled={!String(txt[r.consecutivo] || "").trim()}
                      onClick={() => { onGuardar(i, txt[r.consecutivo]); set(r.consecutivo, ""); }}>
                      Guardar avance
                    </button>
                    <span style={{ fontSize: 11.5, color: T.muted }}>
                      {hist.length ? hist.length + (hist.length === 1 ? " avance previo" : " avances previos") : "Sin avances previos"}
                    </span>
                  </div>
                  {hist.length > 0 && (
                    <div className="avhist">
                      {hist.slice(-3).map((l, k) => <div key={k}>· {l}</div>)}
                    </div>
                  )}
                </div>
              );
            })}
            {!lista.length && (
              <div style={{ padding: 26, textAlign: "center", color: T.muted, fontSize: 13 }}>
                No hay cumplimientos periódicos pendientes de avance.
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============ recordatorios por correo al responsable de la tarea ========= */
/* Lista los pendientes que ya entraron en el umbral de alerta y tienen correo
   registrado. Cada uno abre el cliente de correo con el mensaje escrito; la
   persona lo revisa y lo envía. Queda anotado en la bitácora y en el propio
   requerimiento, para saber cuándo se recordó por última vez.               */
function ModalRecordatorios({ lista, oficina, sesion, onCerrar, onEnviar }) {
  const [abierto, setAbierto] = useState("");
  const remitente = (sesion && sesion.nombre) || "";

  return (
    <div className="modal" onClick={(e) => e.target === e.currentTarget && onCerrar()}>
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <div className="cab">
          <h2>Recordar por correo al responsable</h2>
          <button className="btn claro mini" onClick={onCerrar}>Cerrar</button>
        </div>
        <div className="cuerpo">
          <p style={{ fontSize: 13, color: T.muted, lineHeight: 1.6, marginTop: 0 }}>
            Estos pendientes ya entraron en el plazo de alerta y tienen correo registrado.
            Al pulsar «Abrir en el correo» se abre el cliente del equipo con el mensaje ya
            escrito: usted lo revisa y lo envía. La aplicación no envía nada por su cuenta.
          </p>
          <div className="avlista">
            {lista.map(({ i, r, e }) => {
              const u = urgencia(e);
              const t = textoRecordatorio(r, e, oficina, remitente);
              const ver = abierto === r.consecutivo;
              return (
                <div className="avitem" key={i} style={{ "--tono": u.c }}>
                  <div className="avcab">
                    <div style={{ minWidth: 0 }}>
                      <b><span className="caraf">{u.cara}</span>{r.asunto || "(sin asunto)"}</b>
                      <div className="cua">{r.consecutivo} · {r.area || "sin área"} · {r.correo_resp}</div>
                    </div>
                    <div style={{ textAlign: "right", color: u.c, fontWeight: 700, fontSize: 12.5 }}>
                      {e.motivo}
                      <div className="cua" style={{ color: T.muted }}>
                        {r.ultimo_aviso ? "recordado el " + r.ultimo_aviso : "sin recordatorios previos"}
                      </div>
                    </div>
                  </div>
                  <div className="row" style={{ marginTop: 9 }}>
                    <a className="btn mini oro" href={enlaceRecordatorio(r, e, oficina, remitente)}
                      onClick={() => onEnviar(i)}>✉ Abrir en el correo</a>
                    <button className="btn ghost" onClick={() => setAbierto(ver ? "" : r.consecutivo)}>
                      {ver ? "Ocultar el mensaje" : "Ver el mensaje"}
                    </button>
                  </div>
                  {ver && (
                    <div className="avhist" style={{ whiteSpace: "pre-wrap" }}>
                      <b style={{ color: T.ink }}>Asunto: {t.asunto}</b>
                      {"\n\n" + t.cuerpo}
                    </div>
                  )}
                </div>
              );
            })}
            {!lista.length && (
              <div style={{ padding: 26, textAlign: "center", color: T.muted, fontSize: 13 }}>
                No hay pendientes con correo registrado dentro del plazo de alerta.
                Escriba el correo del responsable en el requerimiento para poder recordarle.
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function Reportes({ ev, areas, oficina, sesion, alerta, avisar, bitacora, fichaIni, setFichaIni }) {
  const hoyI = hoyISO();
  const [rep, setRep] = useState({
    desde: "", hasta: "", area: "todas", alcance: "todos",
    detalle: true, incluirResueltos: true, titulo: "",
    modo: fichaIni ? "ficha" : "general", foco: fichaIni || "",
  });
  const set = (k, v) => setRep((p) => ({ ...p, [k]: v }));

  /* Al llegar desde el botón «Ficha» de una tabla, el informe se abre ya
     apuntando a ese requerimiento. */
  useEffect(() => {
    if (!fichaIni) return;
    setRep((p) => ({ ...p, modo: "ficha", foco: fichaIni }));
    setFichaIni && setFichaIni("");
  }, [fichaIni]);

  const lista = useMemo(() => ev.filter(({ r, e }) => {
    if (rep.area !== "todas" && r.area !== rep.area) return false;
    if (rep.alcance === "pendientes" && r.estado === "Resuelto") return false;
    if (rep.alcance === "criticos" && !(e.s === "vencido" || e.s === "porvencer")) return false;
    if (!rep.incluirResueltos && r.estado === "Resuelto") return false;
    if (rep.desde || rep.hasta) {
      const v = dISO(r.fecha_registro);
      if (!v) return false;
      if (rep.desde && v < rep.desde) return false;
      if (rep.hasta && v > rep.hasta) return false;
    }
    return true;
  }), [ev, rep]);

  const conteo = { resuelto: 0, tiempo: 0, porvencer: 0, vencido: 0 };
  lista.forEach(({ e }) => conteo[e.s]++);
  const total = lista.length;
  const pct = total ? Math.round((conteo.resuelto / total) * 100) : 0;

  const porArea = (areas || []).map((a) => {
    const f = lista.filter((x) => x.r.area === a);
    const c = f.filter((x) => x.e.s === "resuelto").length;
    return { a, n: f.length, c, pct: f.length ? Math.round((c / f.length) * 100) : 0,
      venc: f.filter((x) => x.e.s === "vencido").length };
  }).filter((x) => x.n).sort((x, y) => y.n - x.n);

  const criticos = lista.filter(({ e }) => e.s === "vencido" || e.s === "porvencer")
    .sort((a, b) => ORDEN.indexOf(a.e.s) - ORDEN.indexOf(b.e.s) || (a.e.rest ?? 9e9) - (b.e.rest ?? 9e9));

  const periodo = rep.desde || rep.hasta
    ? "Del " + (rep.desde ? fmt(rep.desde) : "inicio") + " al " + (rep.hasta ? fmt(rep.hasta) : fmt(hoyI))
    : "Histórico completo";

  const emitido = new Date().toLocaleString("es-CO", { dateStyle: "long", timeStyle: "short" });

  /* --------------------- informe de un solo requerimiento ---------------- */
  const opcionesFoco = useMemo(
    () => ev.slice().sort((a, b) => String(b.r.fecha_registro || "").localeCompare(String(a.r.fecha_registro || ""))),
    [ev]
  );
  const focoX = useMemo(() => ev.find((x) => x.r.consecutivo === rep.foco) || null, [ev, rep.foco]);
  const ficha = rep.modo === "ficha";

  const cuerpo = useRef(null);

  /* Se imprime una copia del informe colgada del body: el navegador recibe un
     documento limpio, sin el fondo ni la barra de la aplicación. */
  function imprimir() {
    if (ficha && !focoX) { avisar && avisar("Elija primero el requerimiento que quiere imprimir.", true); return; }
    if (!ficha && !total) { avisar && avisar("No hay registros que reportar con esos criterios.", true); return; }
    const nodo = cuerpo.current;
    if (!nodo) return;
    let caja = document.getElementById("impresion");
    if (!caja) { caja = document.createElement("div"); caja.id = "impresion"; document.body.appendChild(caja); }
    /* Las reglas visuales del informe cuelgan de .gc: el clon la conserva para
       que el PDF se vea igual que la vista previa. */
    caja.className = "gc";
    caja.innerHTML = "";
    caja.appendChild(nodo.cloneNode(true));
    document.body.classList.add("modo-impresion");
    const limpiar = () => {
      document.body.classList.remove("modo-impresion");
      caja.innerHTML = "";
      window.removeEventListener("afterprint", limpiar);
    };
    window.addEventListener("afterprint", limpiar);
    setTimeout(() => { window.print(); setTimeout(limpiar, 1200); }, 60);
  }

  return (
    <>
      <div className="panel repbarra" style={{ padding: 14 }}>
        <div className="campoq" style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          <label style={{ fontSize: 10.5, letterSpacing: ".1em", textTransform: "uppercase", color: T.muted, fontFamily: "'IBM Plex Mono',monospace" }}>Tipo de informe</label>
          <select value={rep.modo} onChange={(e) => set("modo", e.target.value)} style={{ width: "auto" }}>
            <option value="general">General de cumplimientos</option>
            <option value="ficha">Ficha de un requerimiento</option>
          </select>
        </div>

        {ficha ? (
          <div className="campoq" style={{ display: "flex", flexDirection: "column", gap: 4, minWidth: 280, flex: "1 1 320px" }}>
            <label style={{ fontSize: 10.5, letterSpacing: ".1em", textTransform: "uppercase", color: T.muted, fontFamily: "'IBM Plex Mono',monospace" }}>Requerimiento</label>
            <select value={rep.foco} onChange={(e) => set("foco", e.target.value)}>
              <option value="">— Elija el requerimiento —</option>
              {opcionesFoco.map(({ i, r, e }) => (
                <option key={i} value={r.consecutivo}>
                  {r.consecutivo} · {String(r.asunto || "(sin asunto)").slice(0, 60)} · {SEM[e.s].l}
                </option>
              ))}
            </select>
          </div>
        ) : (
          <>
            <div className="campoq" style={{ display: "flex", flexDirection: "column", gap: 4, minWidth: 190, flex: "1 1 190px" }}>
              <label style={{ fontSize: 10.5, letterSpacing: ".1em", textTransform: "uppercase", color: T.muted, fontFamily: "'IBM Plex Mono',monospace" }}>Título del informe</label>
              <input value={rep.titulo} onChange={(e) => set("titulo", e.target.value)}
                placeholder="Informe de cumplimientos" />
            </div>
            <div className="campoq" style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <label style={{ fontSize: 10.5, letterSpacing: ".1em", textTransform: "uppercase", color: T.muted, fontFamily: "'IBM Plex Mono',monospace" }}>Desde</label>
              <input type="date" value={rep.desde} onChange={(e) => set("desde", e.target.value)} style={{ width: "auto" }} />
            </div>
            <div className="campoq" style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <label style={{ fontSize: 10.5, letterSpacing: ".1em", textTransform: "uppercase", color: T.muted, fontFamily: "'IBM Plex Mono',monospace" }}>Hasta</label>
              <input type="date" value={rep.hasta} onChange={(e) => set("hasta", e.target.value)} style={{ width: "auto" }} />
            </div>
            <div className="campoq" style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <label style={{ fontSize: 10.5, letterSpacing: ".1em", textTransform: "uppercase", color: T.muted, fontFamily: "'IBM Plex Mono',monospace" }}>Área</label>
              <select value={rep.area} onChange={(e) => set("area", e.target.value)} style={{ width: "auto" }}>
                <option value="todas">Todas las áreas</option>
                {(areas || []).map((a) => <option key={a} value={a}>{a}</option>)}
              </select>
            </div>
            <div className="campoq" style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <label style={{ fontSize: 10.5, letterSpacing: ".1em", textTransform: "uppercase", color: T.muted, fontFamily: "'IBM Plex Mono',monospace" }}>Alcance</label>
              <select value={rep.alcance} onChange={(e) => set("alcance", e.target.value)} style={{ width: "auto" }}>
                <option value="todos">Todo</option>
                <option value="pendientes">Solo pendientes</option>
                <option value="criticos">Vencidos y por vencer</option>
              </select>
            </div>
            <label className="chk" style={{ margin: 0, alignItems: "center" }}>
              <input type="checkbox" checked={rep.detalle} onChange={(e) => set("detalle", e.target.checked)} />
              <span>Incluir detalle</span>
            </label>
          </>
        )}
        <button className="btn oro" onClick={imprimir}>Generar PDF</button>
      </div>

      <div className="reporte" ref={cuerpo}>
        <div className="rep-cab">
          <img src={window.MARCA} alt="" />
          <div className="tit">
            <h1>{rep.titulo.trim() || (ficha ? "Ficha del requerimiento" : "Informe de cumplimientos")}</h1>
            <div className="sub">Gestor de Cumplimientos · {oficina || "Sin definir"}</div>
          </div>
          <div className="meta">
            {ficha ? (focoX ? focoX.r.consecutivo : "Sin requerimiento") : periodo}<br />
            Emitido: {emitido}<br />
            Por: {(sesion && sesion.nombre) || "—"}<br />
            Alerta: {alerta} días
          </div>
        </div>

        {ficha && <FichaRegistro x={focoX} bitacora={bitacora} />}

        {!ficha && (<>
        <div className="rep-sec">
          <h2>Resumen ejecutivo</h2>
          <div className="rep-kpis">
            <div className="rep-kpi" style={{ borderLeftColor: T.navy2 }}>
              <div className="l">Registros</div><div className="v" style={{ color: T.navy2 }}>{total}</div></div>
            <div className="rep-kpi" style={{ borderLeftColor: SEM.resuelto.c }}>
              <div className="l">Resueltos</div><div className="v" style={{ color: SEM.resuelto.c }}>{conteo.resuelto}</div></div>
            <div className="rep-kpi" style={{ borderLeftColor: SEM.tiempo.c }}>
              <div className="l">En tiempo</div><div className="v" style={{ color: SEM.tiempo.c }}>{conteo.tiempo}</div></div>
            <div className="rep-kpi" style={{ borderLeftColor: SEM.porvencer.c }}>
              <div className="l">Por vencer</div><div className="v" style={{ color: SEM.porvencer.c }}>{conteo.porvencer}</div></div>
            <div className="rep-kpi" style={{ borderLeftColor: SEM.vencido.c }}>
              <div className="l">Vencidos</div><div className="v" style={{ color: SEM.vencido.c }}>{conteo.vencido}</div></div>
          </div>

          <div style={{ marginTop: 14 }}>
            <div style={{ fontSize: 11.5, marginBottom: 3 }}>
              Nivel de cumplimiento: <b style={{ fontSize: 15 }}>{pct} %</b>
            </div>
            <div className="rep-barra">
              {ORDEN.map((k) => conteo[k] ? (
                <i key={k} style={{ width: (conteo[k] / total) * 100 + "%", background: SEM[k].c }} />
              ) : null)}
            </div>
            <div className="rep-leyenda">
              {ORDEN.map((k) => (
                <span key={k}><span className="rep-punto" style={{ background: SEM[k].c }} />
                  {SEM[k].l}: <b>{conteo[k]}</b></span>
              ))}
            </div>
          </div>
        </div>

        <div className="rep-sec">
          <h2>Cumplimiento por área responsable</h2>
          {porArea.length ? (
            <div className="rep-tabla"><table className="rep">
              <thead><tr><th>Área</th><th className="nw">Total</th><th className="nw">Resueltos</th>
                <th className="nw">Vencidos</th><th style={{ width: "22%" }}>Cumplimiento</th></tr></thead>
              <tbody>
                {porArea.map((x) => (
                  <tr key={x.a}>
                    <td style={{ fontWeight: 600 }}>{x.a}</td>
                    <td>{x.n}</td><td>{x.c}</td>
                    <td style={{ color: x.venc ? SEM.vencido.c : "inherit", fontWeight: x.venc ? 700 : 400 }}>{x.venc}</td>
                    <td>
                      <div className="rep-barra" style={{ margin: 0, height: 11 }}>
                        <i style={{ width: x.pct + "%", background: SEM.resuelto.c }} />
                        <i style={{ width: (100 - x.pct) + "%", background: "#E7EBF1" }} />
                      </div>
                      <span style={{ fontSize: 10 }}>{x.pct} %</span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table></div>
          ) : <div className="rep-vacio">Sin registros para el período y los filtros seleccionados.</div>}
        </div>

        <div className="rep-sec">
          <h2>Atención prioritaria · vencidos y por vencer</h2>
          {criticos.length ? (
            <div className="rep-tabla"><table className="rep">
              <thead><tr><th className="nw">Estado</th><th className="nw">Consecutivo</th>
                <th>Asunto</th><th style={{ width: "18%" }}>Área</th><th className="nw">Plazo</th></tr></thead>
              <tbody>
                {criticos.slice(0, 40).map(({ i, r, e }) => (
                  <tr key={i}>
                    <td className="nw" style={{ color: SEM[e.s].c, fontWeight: 700 }}>{SEM[e.s].l}</td>
                    <td className="nw" style={{ fontFamily: "'IBM Plex Mono',monospace" }}>{r.consecutivo}</td>
                    <td>{r.asunto}{esPeriodico(r) ? " (periódico)" : ""}</td>
                    <td>{r.area}</td>
                    <td className="nw" style={{ fontFamily: "'IBM Plex Mono',monospace" }}>{fmt(r.fecha_plazo)}</td>
                  </tr>
                ))}
              </tbody>
            </table></div>
          ) : <div className="rep-vacio">No hay requerimientos vencidos ni próximos a vencer.</div>}
          {criticos.length > 40 && <div style={{ fontSize: 10.5, color: T.muted, marginTop: 6 }}>
            Se listan los 40 más urgentes de {criticos.length}.</div>}
        </div>

        {rep.detalle && (
          <div className="rep-sec">
            <h2>Detalle de registros</h2>
            {lista.length ? (
              <div className="rep-tabla"><table className="rep">
                <thead><tr><th className="nw">Consecutivo</th><th className="nw">Recibido</th>
                  <th>Asunto</th><th style={{ width: "16%" }}>Área</th><th className="nw">Plazo</th>
                  <th className="nw">Estado</th><th className="nw">Atención</th></tr></thead>
                <tbody>
                  {lista.map(({ i, r, e }) => (
                    <tr key={i}>
                      <td className="nw" style={{ fontFamily: "'IBM Plex Mono',monospace" }}>{r.consecutivo}</td>
                      <td className="nw" style={{ fontFamily: "'IBM Plex Mono',monospace" }}>{r.consec_doc || "—"}</td>
                      <td>{r.asunto}{esPeriodico(r) ? " (periódico)" : ""}</td>
                      <td>{r.area}</td>
                      <td className="nw" style={{ fontFamily: "'IBM Plex Mono',monospace" }}>{fmt(r.fecha_plazo)}</td>
                      <td className="nw" style={{ color: SEM[e.s].c }}>{SEM[e.s].l}</td>
                      <td className="nw" style={{ fontFamily: "'IBM Plex Mono',monospace" }}>{r.fecha_atencion ? fmt(r.fecha_atencion) : "—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table></div>
            ) : <div className="rep-vacio">Sin registros para el período y los filtros seleccionados.</div>}
          </div>
        )}
        </>)}

        <div className="rep-pie">
          <span>Gestor de Cumplimientos · {oficina || "Sin definir"} · Documento de uso interno</span>
          <span>{ficha ? (focoX ? focoX.r.consecutivo : "—") : total + " registros"} · generado el {emitido}</span>
        </div>
      </div>
    </>
  );
}

/* ================= ficha imprimible de un solo requerimiento ============= */
/* Reúne en una hoja todo lo que se sabe del requerimiento: los datos con que
   entró, el estado del plazo, lo que el usuario ha ido reportando como avance,
   la respuesta con que se cerró y la traza de la bitácora que le corresponde. */
function Dato({ k, v }) {
  return <div className="rep-dato"><div className="k">{k}</div><div className="v">{v || "—"}</div></div>;
}

function FichaRegistro({ x, bitacora }) {
  if (!x) return (
    <div className="rep-sec">
      <div className="rep-vacio">Elija un requerimiento en la barra superior para armar su ficha.</div>
    </div>
  );

  const r = x.r, e = x.e, u = urgencia(e);
  const avances = lineasAvance(r);
  const traza = (bitacora || []).filter((b) => String(b.consecutivo || "") === String(r.consecutivo));
  const cerrado = String(r.estado) === "Resuelto";

  return (
    <>
      <div className="rep-sec">
        <h2>Identificación del requerimiento</h2>
        <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 4, lineHeight: 1.3 }}>
          <span className="caraf" style={{ fontSize: 17 }}>{u.cara}</span>{r.asunto || "(sin asunto)"}
        </div>
        <div style={{ fontSize: 11, color: T.muted, marginBottom: 12 }}>
          {r.consecutivo} · {r.oficina || "sin oficina"} · registrado el {r.fecha_registro || "—"}
        </div>
        <div className="rep-fichas">
          <Dato k="Tipo de requerimiento" v={r.tipo_req} />
          <Dato k="Medio de recepción" v={r.medio} />
          <Dato k="Consecutivo de recibido" v={r.consec_doc} />
          <Dato k="Solicitante" v={r.solicitante} />
          <Dato k="Área responsable" v={r.area} />
          <Dato k="Correo del responsable" v={r.correo_resp} />
          <Dato k="Prioridad" v={r.prioridad} />
          <Dato k="Último recordatorio" v={r.ultimo_aviso} />
          <Dato k="Registrado por" v={r.registrado_por} />
          <Dato k="Última modificación" v={r.modificado} />
        </div>
        {r.descripcion && (
          <div style={{ marginTop: 12 }}>
            <div className="rep-dato" style={{ border: 0, paddingBottom: 2 }}>
              <div className="k" style={{ flex: "0 0 auto" }}>Descripción de la solicitud</div>
            </div>
            <p className="rep-parr">{r.descripcion}</p>
          </div>
        )}
      </div>

      <div className="rep-sec">
        <h2>Estado y plazo</h2>
        <div className="rep-kpis" style={{ gridTemplateColumns: "repeat(4,1fr)" }}>
          <div className="rep-kpi" style={{ borderLeftColor: SEM[e.s].c }}>
            <div className="l">Semáforo</div>
            <div className="v" style={{ color: SEM[e.s].c, fontSize: 15 }}>{SEM[e.s].l}</div>
          </div>
          <div className="rep-kpi" style={{ borderLeftColor: u.c }}>
            <div className="l">Situación</div>
            <div className="v" style={{ color: u.c, fontSize: 15 }}>{u.cara} {e.motivo}</div>
          </div>
          <div className="rep-kpi" style={{ borderLeftColor: T.navy2 }}>
            <div className="l">Fecha plazo</div>
            <div className="v" style={{ fontSize: 15 }}>{fmt(r.fecha_plazo)}</div>
          </div>
          <div className="rep-kpi" style={{ borderLeftColor: T.navy2 }}>
            <div className="l">Periodicidad</div>
            <div className="v" style={{ fontSize: 13 }}>
              {esPeriodico(r) ? "Mensual · " + rotuloDia(r.dia_mes) : "Plazo fijo"}
            </div>
          </div>
        </div>
      </div>

      <div className="rep-sec">
        <h2>Avances reportados por el responsable</h2>
        {avances.length ? avances.map((l, k) => {
          const p = l.split(" · ");
          return (
            <div className="rep-linea" key={k}>
              <b>{p[0]}{p[1] ? " · " + p[1] : ""}</b>
              {p.slice(2).join(" · ") || l}
            </div>
          );
        }) : (
          <div className="rep-vacio">
            {esPeriodico(r)
              ? "Todavía no se ha reportado ningún avance de este cumplimiento."
              : "Este requerimiento no tiene avances registrados."}
          </div>
        )}
      </div>

      <div className="rep-sec">
        <h2>Cumplimiento y respuesta</h2>
        {cerrado ? (
          <>
            <div className="rep-fichas">
              <Dato k="Fecha de atención" v={fmt(r.fecha_atencion)} />
              <Dato k="Tipo de respuesta" v={r.tipo_resp} />
              <Dato k="Consecutivo de respuesta" v={r.consec_resp} />
              <Dato k="Resuelto por" v={r.resuelto_por} />
              <Dato k="Días de atención"
                v={r.fecha_atencion && r.fecha_registro ? dias(r.fecha_registro, r.fecha_atencion) + " días" : "—"} />
              <Dato k="Oportunidad" v={e.motivo} />
            </div>
            {r.desc_resp && <p className="rep-parr" style={{ marginTop: 10 }}>{r.desc_resp}</p>}
          </>
        ) : (
          <div className="rep-vacio">Pendiente: todavía no se ha registrado el cumplimiento.</div>
        )}
      </div>

      <div className="rep-sec">
        <h2>Traza de bitácora de este requerimiento</h2>
        {traza.length ? (
          <div className="rep-tabla"><table className="rep">
            <thead><tr><th className="nw">Fecha</th><th>Acción</th><th style={{ width: "22%" }}>Usuario</th><th>Detalle</th></tr></thead>
            <tbody>
              {traza.map((b, k) => (
                <tr key={k}>
                  <td className="nw" style={{ fontFamily: "'IBM Plex Mono',monospace" }}>{b.fecha}</td>
                  <td style={{ fontWeight: 600 }}>{b.accion}</td>
                  <td>{b.usuario}</td>
                  <td>{b.detalle || "—"}</td>
                </tr>
              ))}
            </tbody>
          </table></div>
        ) : <div className="rep-vacio">Sin movimientos anotados para este consecutivo en la sesión actual.</div>}
      </div>
    </>
  );
}

function Filtros({ busca, setBusca, fArea, setFArea, fSem, setFSem, total, mostrados, sinSem, areas, agregarArea }) {
  return (
    <div className="row" style={{ marginBottom: 10 }}>
      <input style={{ flex: "1 1 200px", width: "auto" }} placeholder="Buscar por consecutivo, asunto, solicitante…" value={busca} onChange={(e) => setBusca(e.target.value)} />
      {agregarArea
        ? <SelectArea valor={fArea} onCambio={setFArea} areas={areas} onAgregarArea={agregarArea} />
        : (
          <select style={{ width: "auto" }} value={fArea} onChange={(e) => setFArea(e.target.value)}>
            <option value="todas">Todas las áreas</option>{(areas || []).map((a) => <option key={a}>{a}</option>)}
          </select>
        )}
      {!sinSem && (
        <select style={{ width: "auto" }} value={fSem} onChange={(e) => setFSem(e.target.value)}>
          <option value="todos">Todo el semáforo</option>{ORDEN.map((s) => <option key={s} value={s}>{SEM[s].l}</option>)}
        </select>
      )}
      <span className="conteo">{mostrados} de {total}</span>
    </div>
  );
}

/* ========================== pantalla de inicio =========================== */
function PantallaInicio({ arrancando, soporta, hayPrevio, onCrear, onAbrir, onReconectar }) {
  const [modo, setModo] = useState(null);   // null | "nueva"
  const [n, setN] = useState("");
  const [err, setErr] = useState("");
  const listo = titulo(n).length >= 3;

  function crear() {
    if (!listo) return setErr("Escriba el nombre de la oficina (mínimo 3 letras).");
    onCrear(n);
  }

  if (arrancando) return (
    <div className="wrap" style={{ maxWidth: 620, paddingTop: 90, textAlign: "center" }}>
      <div className="eyebrow">Verificando si hay una base vinculada…</div>
    </div>
  );

  return (
    <div className="wrap" style={{ maxWidth: 780, paddingTop: 42 }}>
      <div style={{ textAlign: "center", marginBottom: 26 }}>
        <img src={window.MARCA} alt="" style={{ width: 78, height: 78, borderRadius: "50%",
          border: "2px solid " + T.gold, boxShadow: "0 0 0 4px rgba(6,17,34,.75),0 6px 20px rgba(0,0,0,.5)" }} />
        <h1 style={{ color: "#fff", fontSize: 34, marginTop: 16, textShadow: "0 2px 14px rgba(0,0,0,.7)" }}>
          Gestor de Cumplimientos
        </h1>
        <div style={{ color: "#D3DEEC", fontSize: 15, marginTop: 6, textShadow: "0 1px 8px rgba(0,0,0,.75)" }}>
          Control de comunicaciones y pendientes de oficina
        </div>
      </div>

      {modo !== "nueva" ? (
        <>
          <div className="grid">
            <div className="panel" style={{ padding: 20, display: "flex", flexDirection: "column" }}>
              <div className="eyebrow">Es la primera vez</div>
              <h2 style={{ fontSize: 21, margin: "8px 0 10px", color: T.navy }}>Crear la base de datos</h2>
              <p style={{ fontSize: 13.5, color: T.muted, lineHeight: 1.6, flex: 1 }}>
                Indique el nombre de su oficina y elija dónde guardar el Excel. Puede ponerlo en la
                carpeta de OneDrive o Drive para que quede respaldado en la nube.
              </p>
              <button className="btn oro" style={{ width: "100%", marginTop: 14 }} onClick={() => setModo("nueva")}>
                Crear base nueva
              </button>
            </div>

            <div className="panel" style={{ padding: 20, display: "flex", flexDirection: "column" }}>
              <div className="eyebrow">Ya tengo el archivo</div>
              <h2 style={{ fontSize: 21, margin: "8px 0 10px", color: T.navy }}>Abrir un Excel existente</h2>
              <p style={{ fontSize: 13.5, color: T.muted, lineHeight: 1.6, flex: 1 }}>
                Busque el archivo donde lo tenga guardado. La aplicación lee el nombre de la oficina
                desde la hoja Configuración o, si no existe, desde la columna Oficina de los registros.
              </p>
              <button className="btn azul" style={{ width: "100%", marginTop: 14 }} onClick={onAbrir}>
                Seleccionar mi Excel
              </button>
            </div>
          </div>

          {hayPrevio && (
            <div className="panel" style={{ padding: 14, marginTop: 12, display: "flex", gap: 12,
              flexWrap: "wrap", alignItems: "center", justifyContent: "space-between" }}>
              <div style={{ fontSize: 13.5 }}>
                Última base utilizada en este equipo: <b>{hayPrevio}</b>
              </div>
              <button className="btn mini" onClick={onReconectar}>Reconectar</button>
            </div>
          )}

          {!soporta && (
            <div className="panel" style={{ padding: 14, marginTop: 12, borderLeft: "4px solid " + T.bad, fontSize: 13.5 }}>
              Este navegador no permite escribir archivos. Para el guardado automático abra la
              aplicación en <b>Google Chrome</b> o <b>Microsoft Edge</b>.
            </div>
          )}
        </>
      ) : (
        <div className="panel" style={{ padding: 22, maxWidth: 560, margin: "0 auto" }}>
          <div className="eyebrow">Paso 1 de 2 · Base nueva</div>
          <h2 style={{ fontSize: 21, margin: "8px 0 10px", color: T.navy }}>¿Qué oficina va a usar el gestor?</h2>
          <p style={{ fontSize: 13.5, color: T.muted, lineHeight: 1.6 }}>
            El nombre aparece en el encabezado y queda guardado dentro del Excel, en la hoja
            <b> Configuración</b> y en la columna <b>Oficina</b> de cada registro. Así, si se pierde
            este archivo HTML, al abrir el Excel de nuevo la aplicación reconoce sola a qué oficina
            pertenece la base.
          </p>
          <label className="f req">Nombre de la oficina</label>
          <input list="dl-oficinas" value={n} autoFocus
            onChange={(e) => { setN(e.target.value); setErr(""); }}
            onKeyDown={(e) => e.key === "Enter" && crear()}
            placeholder="Ejemplo: Contratos, Tecnologías, Financiera" />
          <datalist id="dl-oficinas">{OFICINAS.map((o) => <option key={o} value={o} />)}</datalist>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginTop: 12 }}>
            {OFICINAS.slice(0, 6).map((o) => (
              <button key={o} className="btn mini" onClick={() => { setN(o); setErr(""); }}>{o}</button>
            ))}
          </div>
          {err && <p style={{ color: T.bad, fontSize: 13, marginBottom: 0, marginTop: 14 }}>{err}</p>}
          <div className="row" style={{ marginTop: 20, justifyContent: "space-between" }}>
            <button className="btn ghost" onClick={() => setModo(null)}>Volver</button>
            <button className="btn oro" disabled={!listo} onClick={crear}>
              Continuar y elegir dónde guardar
            </button>
          </div>
        </div>
      )}

      <p style={{ textAlign: "center", color: "#B9C7DA", fontSize: 11.5, marginTop: 26,
        textShadow: "0 1px 6px rgba(0,0,0,.7)" }}>
        La información no sale de su equipo: todo se procesa en el navegador y se guarda solo en el
        Excel que usted elija.
      </p>
    </div>
  );
}

function ModalEditar({ x, cats, areas, correos, onCat, onCancel, onSave }) {
  const [f, setF] = useState({ ...x.r });
  const [err, setErr] = useState("");
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  function guardar() { setErr(""); onSave(f); }
  return (
    <div className="modal" onClick={(e) => e.target === e.currentTarget && onCancel()}>
      <div className="sheet">
        <div className="cab">
          <div>
            <div style={{ fontSize: 10.5, letterSpacing: ".16em", textTransform: "uppercase", color: "#A9B7C9", fontFamily: "'IBM Plex Mono',monospace" }}>Editar {f.consecutivo}</div>
            <h2>{f.asunto}</h2>
          </div>
          <button className="btn claro mini" onClick={onCancel}>✕</button>
        </div>
        <div className="cuerpo">
          <div className="grid">
            <SelectorCatalogo etiqueta="Tipo de requerimiento" valor={f.tipo_req || ""} onCambio={(v) => set("tipo_req", v)}
              opciones={cats.tipos_req} onAgregar={(v, fz) => onCat("tipos_req", v, fz)} nuevoTexto="Agregar un tipo de requerimiento" />
            <SelectorCatalogo etiqueta="Medio de recepción" valor={f.medio || ""} onCambio={(v) => set("medio", v)}
              opciones={cats.medios} onAgregar={(v, fz) => onCat("medios", v, fz)} nuevoTexto="Agregar un medio de recepción" />
            <Campo l="Consecutivo de Recibido"><input value={f.consec_doc || ""} onChange={(e) => set("consec_doc", e.target.value)} /></Campo>
            <SelectorCatalogo etiqueta="Solicitante" valor={f.solicitante || ""} onCambio={(v) => set("solicitante", v)}
              opciones={cats.solicitantes} onAgregar={(v, fz) => onCat("solicitantes", v, fz)} nuevoTexto="Agregar un solicitante" />
            <SelectorCatalogo etiqueta="Área responsable" valor={f.area || ""} onCambio={(v) => { set("area", v); setErr(""); }}
              opciones={areas} onAgregar={(v, fz) => onCat("areas", v, fz)} nuevoTexto="Agregar un área responsable" />
            <CampoCorreo valor={f.correo_resp} onCambio={(v) => set("correo_resp", v)} correos={correos} />
            <Campo l="Asunto" full><input value={f.asunto || ""} onChange={(e) => set("asunto", e.target.value)} /></Campo>
            <Campo l="Descripción de la solicitud" full><textarea value={f.descripcion || ""} onChange={(e) => set("descripcion", e.target.value)} /></Campo>
            <Campo l="Prioridad"><select value={f.prioridad || ""} onChange={(e) => set("prioridad", e.target.value)}><option value="" />{CAT.prioridad.map((o) => <option key={o}>{o}</option>)}</select></Campo>
            <PlazoCumplimiento f={f} set={set} full />
            {f.estado === "Resuelto" && (
              <>
                <Campo l="Fecha de atención"><input type="date" value={dISO(f.fecha_atencion)} onChange={(e) => set("fecha_atencion", e.target.value)} /></Campo>
                <Campo l="Tipo de respuesta"><input value={f.tipo_resp || ""} onChange={(e) => set("tipo_resp", e.target.value)} /></Campo>
                <Campo l="Consecutivo de respuesta"><input value={f.consec_resp || ""} onChange={(e) => set("consec_resp", e.target.value)} /></Campo>
                <Campo l="Resuelto por"><input value={f.resuelto_por || ""} onChange={(e) => set("resuelto_por", e.target.value)} /></Campo>
                <Campo l="Descripción de la respuesta" full><textarea value={f.desc_resp || ""} onChange={(e) => set("desc_resp", e.target.value)} /></Campo>
              </>
            )}
          </div>
          {err && <p style={{ color: T.bad, fontSize: 12.5, marginTop: 12, marginBottom: 0 }}>{err}</p>}
          <div className="row" style={{ marginTop: 18, justifyContent: "flex-end" }}>
            <button className="btn ghost" onClick={onCancel}>Cancelar</button>
            <button className="btn oro" onClick={guardar}>Guardar cambios</button>
          </div>
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("raiz")).render(<App />);
</script>
</body>
</html>
