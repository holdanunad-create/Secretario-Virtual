function FormRespuesta({ x, funcs, onAgregarFunc, onCancel, onGuardar }) {
  const r = x.r;
  const [f, setF] = useState({ fecha_atencion: hoyISO(), tipo_resp: "", otro: "", consec_resp: "", desc_resp: "", resuelto_por: "" });
  const [nuevo, setNuevo] = useState("");
  const [msg, setMsg] = useState(null);
  const [err, setErr] = useState("");
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));

  function agregar() {
    const r2 = onAgregarFunc(nuevo);
    if (!r2.ok) return setMsg({ err: true, t: r2.msg });
    set("resuelto_por", r2.nombre); setNuevo(""); setMsg({ err: false, t: "Funcionario " + r2.nombre + " agregado." });
  }
  function guardar() {
    if (!f.tipo_resp) return setErr("Selecciona el tipo de respuesta.");
    if (f.tipo_resp === "Otro" && !f.otro.trim()) return setErr("Indica cuál es el otro tipo de respuesta.");
    if (!f.resuelto_por) return setErr("Indica quién resolvió el requerimiento.");
    const tipo = f.tipo_resp === "Otro" ? "Otro: " + titulo(f.otro) : f.tipo_resp;
    onGuardar({ fecha_atencion: f.fecha_atencion, tipo_resp: tipo, consec_resp: f.consec_resp, desc_resp: f.desc_resp, resuelto_por: f.resuelto_por });
  }
  return (
    <div className="panel">
      <div style={{ background: T.navy2, color: "#fff", padding: "13px 16px", borderRadius: "7px 7px 0 0" }}>
        <div style={{ fontSize: 10.5, letterSpacing: ".16em", textTransform: "uppercase", color: "#A9B7C9", fontFamily: "'IBM Plex Mono',monospace" }}>
          Registrar cumplimiento · {r.consecutivo}
        </div>
        <h2 style={{ fontSize: 18, marginTop: 5 }}>{r.asunto}</h2>
      </div>
      <div style={{ padding: 16 }}>
        <div style={{ background: "#F4F6FA", border: "1px solid " + T.line, borderRadius: 7, padding: 12, fontSize: 12.5, marginBottom: 16 }}>
          <b>Doc. recibido:</b> {r.consec_doc || "—"} · <b>Solicitante:</b> {r.solicitante || "—"} · <b>Medio:</b> {r.medio || "—"} ·{" "}
          <b>Área:</b> {r.area || "—"} · <b>Plazo:</b> {fmt(r.fecha_plazo)}
          {esPeriodico(r) && r.dia_mes ? <> · <b>Periódico:</b> {rotuloDia(r.dia_mes)}. Al registrar el cumplimiento se abrirá el ciclo siguiente
            (vence {fmt(siguienteCiclo(r.dia_mes, r.fecha_plazo))}).</> : null}
          {r.descripcion && <div style={{ marginTop: 7, color: T.muted }}>{r.descripcion}</div>}
        </div>
        <div className="grid">
          <Campo l="Fecha de atención" req><input type="date" value={f.fecha_atencion} onChange={(e) => set("fecha_atencion", e.target.value)} /></Campo>
          <Campo l="Tipo de respuesta" req>
            <select value={f.tipo_resp} onChange={(e) => set("tipo_resp", e.target.value)}>
              <option value="">— Seleccione —</option>{CAT.tipo_resp.map((o) => <option key={o}>{o}</option>)}
            </select>
          </Campo>
          {f.tipo_resp === "Otro" && (
            <Campo l="¿Cuál?" req full><input value={f.otro} onChange={(e) => set("otro", e.target.value)} placeholder="Describe el medio de respuesta utilizado" /></Campo>
          )}
          <Campo l="Consecutivo de respuesta"><input value={f.consec_resp} onChange={(e) => set("consec_resp", e.target.value)} placeholder="Número de oficio, GEPOL o acta" /></Campo>
          <Campo l="Resuelto por" req>
            <select value={f.resuelto_por} onChange={(e) => set("resuelto_por", e.target.value)}>
              <option value="">— Seleccione —</option>{funcs.map((o) => <option key={o}>{o}</option>)}
            </select>
            <div className="row" style={{ marginTop: 7, flexWrap: "nowrap" }}>
              <input value={nuevo} onChange={(e) => { setNuevo(e.target.value); setMsg(null); }} placeholder="Agregar funcionario nuevo" />
              <button className="btn mini" onClick={agregar}>Agregar</button>
            </div>
            {msg && <div className="hint" style={{ color: msg.err ? T.bad : T.ok }}>{msg.t}</div>}
          </Campo>
          <Campo l="Descripción de la respuesta" full><textarea value={f.desc_resp} onChange={(e) => set("desc_resp", e.target.value)} placeholder="Qué se hizo, qué se entregó y a quién" /></Campo>
        </div>
        {err && <p style={{ color: T.bad, fontSize: 12.5, marginTop: 12, marginBottom: 0 }}>{err}</p>}
        <div className="row" style={{ marginTop: 16 }}>
          <button className="btn oro" onClick={guardar}>Guardar cumplimiento</button>
          <button className="btn ghost" onClick={onCancel}>Volver a la lista</button>
        </div>
      </div>
    </div>
  );
}

/* ============================ vista: tablero ============================ */
function Tablero({ conteo, cumpl, rows, ev, cumplAlerta, setTab, setFSem, areas }) {
  const porArea = (areas || []).map((a) => {
    const g = ev.filter((x) => x.r.area === a);
    return { a, total: g.length, ok: g.filter((x) => x.e.s === "resuelto").length, mal: g.filter((x) => x.e.s === "vencido").length };
  }).filter((x) => x.total);
  const max = Math.max(1, ...porArea.map((x) => x.total));
  return (
    <>
      <div className="cinta">
        {ORDEN.map((s) => conteo[s] ? (
          <button key={s} className="seg" style={{ background: SEM[s].c, flexGrow: conteo[s], flexBasis: 0 }}
            onClick={() => { setFSem(s); setTab(s === "resuelto" ? "resueltos" : "registro"); }}>
            <span className="n">{conteo[s]}</span><span className="l">{SEM[s].l}</span>
          </button>
        ) : null)}
        {!rows.length && <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", color: T.muted, fontSize: 13 }}>Sin registros</div>}
      </div>
      <div className="kpis" style={{ marginTop: 12 }}>
        <Kpi l="Cumplimiento" v={cumpl + "%"} h={conteo.resuelto + " de " + rows.length} c={T.ok} />
        <Kpi l="Vencidos" v={conteo.vencido} h="acción inmediata" c={T.bad} />
        <Kpi l="Por vencer" v={conteo.porvencer} h={"en " + cumplAlerta + " días o menos"} c={T.warn} />
        <Kpi l="En tiempo" v={conteo.tiempo} h="con holgura" c={T.info} />
        <Kpi l="Prioridad alta" v={rows.filter((r) => r.prioridad === "Alta" && r.estado !== "Resuelto").length} h="pendientes críticos" c={T.navy2} />
      </div>
      <div className="grid" style={{ marginTop: 12 }}>
        <div className="panel" style={{ padding: 16 }}>
          <div className="eyebrow" style={{ marginBottom: 12 }}>Carga por área responsable</div>
          {porArea.map((d) => (
            <div key={d.a} style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 9 }}>
              <div style={{ width: 128, fontSize: 12, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{d.a}</div>
              <div style={{ flex: 1, height: 8, background: "#E6EAF0", borderRadius: 99, display: "flex", overflow: "hidden" }}>
                <i style={{ width: (d.ok / max) * 100 + "%", background: T.ok }} />
                <i style={{ width: ((d.total - d.ok - d.mal) / max) * 100 + "%", background: T.info }} />
                <i style={{ width: (d.mal / max) * 100 + "%", background: T.bad }} />
              </div>
              <div className="mono" style={{ fontSize: 11.5, color: T.muted, width: 24, textAlign: "right" }}>{d.total}</div>
            </div>
          ))}
          {!porArea.length && <p style={{ color: T.muted, fontSize: 13 }}>Sin datos todavía.</p>}
        </div>
        <div className="panel" style={{ padding: 16 }}>
          <div className="eyebrow" style={{ marginBottom: 12 }}>Atención inmediata</div>
          {ev.filter((x) => x.e.s === "vencido" || x.e.s === "porvencer").slice(0, 9).map(({ i, r, e }) => (
            <div key={i} style={{ display: "flex", gap: 9, alignItems: "center", padding: "8px 0", borderBottom: "1px solid #EDF0F4" }}>
              <span className="dot" style={{ background: SEM[e.s].c }} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.asunto}</div>
                <div style={{ fontSize: 11, color: T.muted }}><span className="mono">{r.consecutivo}</span> · {r.area || "sin área"} · {e.motivo}</div>
              </div>
            </div>
          ))}
          {!ev.some((x) => x.e.s === "vencido" || x.e.s === "porvencer") && <p style={{ color: T.muted, fontSize: 13 }}>Nada vencido ni por vencer.</p>}
        </div>
      </div>
    </>
  );
}

/* ============================ vista: bitácora =========================== */
function VistaBitacora({ bitacora }) {
  const [q, setQ] = useState("");
  const filas = [...bitacora].reverse()
    .filter((b) => !q || [b.usuario, b.accion, b.consecutivo, b.detalle].some((x) => norm(x).includes(norm(q))));
  const color = (a) => a.indexOf("Eliminó") === 0 || a.indexOf("Alerta") === 0 || a.indexOf("Intento") === 0
    ? T.bad : a.indexOf("Creó") === 0 || a.indexOf("Registró") === 0 ? T.ok : T.info;
  return (
    <>
      <div className="panel" style={{ padding: 14, marginBottom: 12, borderLeft: "4px solid " + T.info, fontSize: 13.5 }}>
        Registro de todo lo ocurrido en la aplicación. Se guarda en la hoja <b>Bitácora</b> del Excel
        y no se puede borrar desde aquí. Conserva los últimos 5.000 movimientos.
      </div>
      <div className="row" style={{ marginBottom: 10 }}>
        <input style={{ flex: "1 1 220px", width: "auto" }} placeholder="Buscar por usuario, acción o consecutivo…"
          value={q} onChange={(e) => setQ(e.target.value)} />
        <span className="conteo">{filas.length} movimientos</span>
      </div>
      <div className="panel" style={{ overflow: "auto", maxHeight: "70vh" }}>
        <table>
          <thead><tr><th>Fecha y hora</th><th>Usuario</th><th>Acción</th><th>Consecutivo</th><th>Detalle</th></tr></thead>
          <tbody>
            {filas.map((b, i) => (
              <tr key={i}>
                <td className="mono" style={{ fontSize: 12, whiteSpace: "nowrap" }}>{b.fecha}</td>
                <td style={{ fontSize: 12.5 }}>{b.usuario}</td>
                <td style={{ fontSize: 12.5, fontWeight: 600, color: color(String(b.accion)) }}>{b.accion}</td>
                <td className="mono" style={{ fontSize: 12 }}>{b.consecutivo || "—"}</td>
                <td style={{ fontSize: 12, color: T.muted, maxWidth: 340 }}>{b.detalle}</td>
              </tr>
            ))}
            {!filas.length && <tr><td colSpan={5} style={{ padding: 30, textAlign: "center", color: T.muted }}>
              Sin movimientos registrados.</td></tr>}
          </tbody>
        </table>
      </div>
    </>
  );
}

  );

/* ==================== selector de catálogo dinámico ====================== */
/* Un desplegable con lo ya registrado y una opción para agregar. El control de
   duplicados vive en resolverCat: aquí solo se muestra lo que responde.
     - Coincidencia exacta ignorando mayúsculas y tildes  -> reutiliza la que existe
     - Parecido por encima del umbral                     -> bloquea y pregunta
     - Sin parecido                                       -> crea                */
function SelectorCatalogo({ etiqueta, req, full, valor, onCambio, opciones, onAgregar, pista, nuevoTexto }) {
  const [modo, setModo] = useState("lista");
  const [texto, setTexto] = useState("");
  const [aviso, setAviso] = useState(null);

  function volver() { setModo("lista"); setTexto(""); setAviso(null); }

  /* Si un registro viejo trae un valor que ya no está en el catálogo, se
     muestra igual: nunca se borra en silencio por editar el registro. */
  const base = opciones || [];
  const lista = valor && !base.some((o) => o === valor) ? [valor, ...base] : base;

  function intentar(forzar) {
    const r = onAgregar(texto, forzar);
    if (r.ok) {
      onCambio(r.valor);
      volver();
      return;
    }
    setAviso(r);
  }

  return (
    <Campo l={etiqueta} req={req} full={full}>
      {modo === "lista" ? (
        <>
          <select value={valor || ""} onChange={(e) => {
            if (e.target.value === "__nuevo__") { setModo("nuevo"); setAviso(null); return; }
            onCambio(e.target.value);
          }}>
            <option value="">— Seleccione —</option>
            {lista.map((o) => <option key={o} value={o}>{o}</option>)}
            <option value="__nuevo__">＋ {nuevoTexto || "Agregar uno nuevo"}</option>
          </select>
          {pista && <div className="hint">{pista}</div>}
        </>
      ) : (
        <div className="catnuevo">
          <label className="f">{nuevoTexto || "Agregar uno nuevo"}</label>
          <div className="row" style={{ flexWrap: "nowrap" }}>
            <input autoFocus value={texto} style={{ flex: 1 }}
              onChange={(e) => { setTexto(e.target.value); setAviso(null); }}
              onKeyDown={(e) => { if (e.key === "Enter") intentar(false); if (e.key === "Escape") volver(); }}
              placeholder="Escriba la denominación completa" />
            <button className="btn mini azul" onClick={() => intentar(false)}>Agregar</button>
            <button className="btn ghost" onClick={volver}>Cancelar</button>
          </div>

          {aviso && (
            <div className={"aviso-dup" + (aviso.similar ? "" : " aviso-bloq")}>
              {aviso.msg}
              {aviso.similar && (
                <div className="row" style={{ marginTop: 10 }}>
                  <button className="btn mini" onClick={() => { onCambio(aviso.similar.valor); volver(); }}>
                    Usar «{aviso.similar.valor}»
                  </button>
                  <button className="btn mini oro" onClick={() => intentar(true)}>
                    Sí, es distinto: agregarlo
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      )}
    </Campo>
  );
}

/* ========================= carrusel de anuncios ========================== */
/* Las láminas viven en la hoja Anuncios del Excel. Avanzan solas cada siete
   segundos y se detienen mientras el cursor está encima o el foco dentro.    */
function Carrusel({ laminas }) {
  const [i, setI] = useState(0);
  const [quieto, setQuieto] = useState(false);
  const total = laminas.length;

  useEffect(() => { if (i >= total) setI(0); }, [total]);

  useEffect(() => {
    if (total < 2 || quieto) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const t = setTimeout(() => setI((x) => (x + 1) % total), 7000);
    return () => clearTimeout(t);
  }, [i, total, quieto]);

  if (!total) return null;
  const a = laminas[Math.min(i, total - 1)];
  const mover = (d) => setI((x) => (x + d + total) % total);
  const Marco = a.enlace ? "a" : "div";
  const extra = a.enlace ? { href: a.enlace, target: "_blank", rel: "noopener noreferrer" } : {};

  return (
    <div className="anuncios"
      onMouseEnter={() => setQuieto(true)} onMouseLeave={() => setQuieto(false)}
      onFocus={() => setQuieto(true)} onBlur={() => setQuieto(false)}>
      <Marco className="lamina" key={i} {...extra}>
        {a.img && <img src={a.img} alt="" />}
        <div className="velo" />
        <div className="txt">
          <h3>{a.titulo}</h3>
          {a.texto && <p>{a.texto}</p>}
          {a.enlace && <div className="cta">Abrir ›</div>}
        </div>
      </Marco>
      {total > 1 && (
        <>
          <button className="paso izq" onClick={() => mover(-1)} aria-label="Anuncio anterior">‹</button>
          <button className="paso der" onClick={() => mover(1)} aria-label="Anuncio siguiente">›</button>
          <div className="puntos">
            {laminas.map((_, k) => (
              <button key={k} aria-current={k === i} aria-label={"Anuncio " + (k + 1)} onClick={() => setI(k)} />
            ))}
          </div>
          {!quieto && <div className="avance" key={"av" + i} />}
        </>
      )}
    </div>
  );
}

/* ============================ menú principal ============================= */
function MenuPrincipal({ tab, setTab, secciones }) {
  const [abierto, setAbierto] = useState(false);
  const [pos, setPos] = useState({ top: 0, left: 0 });
  const zona = useRef(null);
  const boton = useRef(null);

  /* La barra superior recorta lo que se salga de ella, así que el panel se
     dibuja sobre la ventana y se ancla al botón por coordenadas. */
  const ubicar = () => {
    if (!boton.current) return;
    const r = boton.current.getBoundingClientRect();
    setPos({ top: Math.round(r.bottom + 9), left: Math.round(Math.min(r.left, window.innerWidth - 332)) });
  };

  useEffect(() => {
    if (!abierto) return;
    ubicar();
    const fuera = (e) => { if (zona.current && !zona.current.contains(e.target)) setAbierto(false); };
    const esc = (e) => { if (e.key === "Escape") setAbierto(false); };
    document.addEventListener("mousedown", fuera);
    document.addEventListener("keydown", esc);
    window.addEventListener("resize", ubicar);
    window.addEventListener("scroll", ubicar, true);
    return () => {
      document.removeEventListener("mousedown", fuera);
      document.removeEventListener("keydown", esc);
      window.removeEventListener("resize", ubicar);
      window.removeEventListener("scroll", ubicar, true);
    };
  }, [abierto]);

  const urgentes = secciones.reduce((s, x) => s + (x.urgente || 0), 0);

  return (
    <div className="menuzona" ref={zona}>
      <button ref={boton} className="btn oro menu" aria-expanded={abierto} aria-haspopup="true"
        onClick={() => { ubicar(); setAbierto((x) => !x); }}>
        <span className="barras" aria-hidden="true"><i /><i /><i /></span>
        Menú principal
        {urgentes > 0 && <span className="pip">{urgentes}</span>}
        <span className="flecha" aria-hidden="true">▾</span>
      </button>

      {abierto && (
        <div className="menupanel" role="menu" style={{ top: pos.top, left: pos.left }}>
          <div className="cabm">
            <div className="eyebrow">Ir a</div>
          </div>
          {secciones.map((s) => (
            <button key={s.k} role="menuitem" className="mitem" aria-current={tab === s.k}
              onClick={() => { setTab(s.k); setAbierto(false); }}>
              <span className="ico" aria-hidden="true">{s.ico}</span>
              <span className="tx">{s.l}<small>{s.d}</small></span>
              {s.urgente ? <span className="pip">{s.urgente}</span>
                : s.cnt !== undefined ? <span className="cnt">{s.cnt}</span> : null}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ======================= acceso: ingresar o registrarse ================== */
/* El primero que se registra en una base queda como Administrador y entra de
   inmediato. Los demás quedan en estado Pendiente y no pueden ingresar hasta
   que un administrador los apruebe desde Ajustes. La contraseña del
   administrador es la misma que abre la gestión: no hay una clave aparte.   */
function Acceso({ usuarios, oficina, onEntrar, onRegistrar }) {
  const primero = !usuarios.length;
  const [modo, setModo] = useState(primero ? "registro" : "ingreso");
  const [f, setF] = useState({ id: "", nombre: "", clave: "", conf: "" });
  const [msg, setMsg] = useState(null);
  const [ver, setVer] = useState(false);
  const [fallos, setFallos] = useState(0);
  const [espera, setEspera] = useState(0);
  const set = (k, v) => { setF((p) => ({ ...p, [k]: v })); setMsg(null); };

  useEffect(() => {
    if (espera <= 0) return;
    const t = setTimeout(() => setEspera((x) => x - 1), 1000);
    return () => clearTimeout(t);
  }, [espera]);

  function ingresar() {
    if (espera > 0) return;
    const r = onEntrar(f.id, f.clave);
    if (r.ok) return;
    const n = fallos + 1;
    setFallos(n);
    setF((p) => ({ ...p, clave: "" }));
    if (n >= INTENTOS_MAX) { setEspera(BLOQUEO_SEG); setFallos(0); setMsg({ err: true, t: "Demasiados intentos fallidos." }); }
    else setMsg({ err: true, t: r.msg + " Intento " + n + " de " + INTENTOS_MAX + "." });
  }

  function registrar() {
    const r = onRegistrar(f);
    setMsg({ err: !r.ok, t: r.msg });
    if (r.ok) { setF({ id: "", nombre: "", clave: "", conf: "" }); if (!r.admin) setModo("ingreso"); }
  }

  const pendientes = usuarios.filter((u) => u.estado === "Pendiente").length;

  return (
    <div className="wrap" style={{ maxWidth: 470, paddingTop: 34, paddingBottom: 40 }}>
      <div style={{ textAlign: "center", marginBottom: 20 }}>
        <img src={window.MARCA} alt="" style={{ width: 68, height: 68, borderRadius: "50%",
          border: "2px solid " + T.gold, boxShadow: "0 0 0 4px rgba(6,17,34,.75),0 6px 20px rgba(0,0,0,.5)" }} />
        <h1 style={{ color: "#fff", fontSize: 26, marginTop: 13, textShadow: "0 2px 14px rgba(0,0,0,.7)" }}>
          Gestor de Cumplimientos
        </h1>
        <div style={{ color: "#D3DEEC", fontSize: 13.5, marginTop: 5, textShadow: "0 1px 8px rgba(0,0,0,.75)" }}>
          {oficina || "Oficina sin definir"} · {usuarios.length} usuario{usuarios.length === 1 ? "" : "s"} en la base
        </div>
      </div>

      <div className="panel" style={{ padding: 22 }}>
        {primero ? (
          <>
            <div className="eyebrow">Base sin usuarios</div>
            <h2 style={{ fontSize: 20, margin: "8px 0 8px", color: T.navy }}>Registre al administrador</h2>
            <p style={{ fontSize: 13, color: T.muted, lineHeight: 1.6, marginTop: 0 }}>
              Es el primer usuario de esta base, así que queda como <b>Administrador</b>. Su contraseña
              es también la que abre la gestión del sistema, y con ella aprobará a quienes se registren
              después.
            </p>
          </>
        ) : (
          <div className="row" style={{ marginBottom: 16, gap: 6 }}>
            <button className={"btn mini" + (modo === "ingreso" ? " azul" : " ghost")} onClick={() => { setModo("ingreso"); setMsg(null); }}>Ingresar</button>
            <button className={"btn mini" + (modo === "registro" ? " azul" : " ghost")} onClick={() => { setModo("registro"); setMsg(null); }}>Registrarse</button>
          </div>
        )}

        <label className="f req">Usuario</label>
        <input value={f.id} autoFocus disabled={espera > 0}
          onChange={(e) => set("id", e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && (modo === "ingreso" ? ingresar() : registrar())}
          placeholder="Ejemplo: h.rojas" />

        {modo === "registro" && (
          <>
            <label className="f req" style={{ marginTop: 12 }}>Nombre completo</label>
            <input value={f.nombre} onChange={(e) => set("nombre", e.target.value)} placeholder="Grado, nombres y apellidos" />
          </>
        )}

        <label className="f req" style={{ marginTop: 12 }}>Contraseña</label>
        <div style={{ position: "relative" }}>
          <input type={ver ? "text" : "password"} value={f.clave} disabled={espera > 0}
            onChange={(e) => set("clave", e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && (modo === "ingreso" ? ingresar() : registrar())}
            style={{ paddingRight: 74 }} placeholder={modo === "registro" ? "Mínimo 6 caracteres" : "Contraseña"} />
          <button className="btn ghost" style={{ position: "absolute", right: 4, top: 4, fontSize: 12 }}
            onClick={() => setVer(!ver)}>{ver ? "Ocultar" : "Ver"}</button>
        </div>

        {modo === "registro" && (
          <>
            <label className="f req" style={{ marginTop: 12 }}>Confirmar contraseña</label>
            <input type="password" value={f.conf} onChange={(e) => set("conf", e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && registrar()} />
          </>
        )}

        {msg && <p style={{ color: msg.err ? T.bad : T.ok, fontSize: 13, marginBottom: 0, marginTop: 13, lineHeight: 1.55 }}>{msg.t}</p>}
        {espera > 0 && <p style={{ color: T.bad, fontSize: 13, marginTop: 6, marginBottom: 0 }}>Espere {espera} segundos antes de volver a intentarlo.</p>}

        <button className="btn oro" style={{ width: "100%", marginTop: 18 }} disabled={espera > 0}
          onClick={() => (modo === "ingreso" ? ingresar() : registrar())}>
          {modo === "ingreso" ? "Ingresar" : primero ? "Crear administrador" : "Enviar solicitud"}
        </button>

        <p className="hint" style={{ marginTop: 14, lineHeight: 1.6 }}>
          {modo === "registro" && !primero
            ? "Su solicitud queda registrada en el Excel y un administrador debe aprobarla antes del primer ingreso."
            : "Las contraseñas se guardan como huella en la hoja Usuarios, nunca en texto legible."}
        </p>
      </div>

      {pendientes > 0 && (
        <p style={{ textAlign: "center", color: "#E8D9A6", fontSize: 12, marginTop: 16,
          textShadow: "0 1px 6px rgba(0,0,0,.7)" }}>
          Hay {pendientes} solicitud{pendientes === 1 ? "" : "es"} de acceso esperando aprobación.
        </p>
      )}
    </div>
  );
}

        ))}
        {!act.length && <p style={{ fontSize: 12.5, color: T.muted }}>No hay usuarios activos.</p>}
      </div>
    </div>
  );
}

/* ================== ajustes: láminas del carrusel ======================== */
/* La imagen se guarda dentro del Excel, partida en trozos porque una celda no
   admite más de 32.767 caracteres. Antes de guardarla se reduce a 1400 px de
   ancho para que el archivo no se dispare de tamaño.                        */
const ANCHO_LAMINA = 1400;
const TOPE_LAMINA = 620000; // caracteres del data URL, ~460 KB de imagen

function reducirImagen(file) {
  return new Promise((resolver, rechazar) => {
    const fr = new FileReader();
    fr.onerror = () => rechazar(new Error("No se pudo leer la imagen."));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rechazar(new Error("El archivo no es una imagen válida."));
      im.onload = () => {
        const esc = Math.min(1, ANCHO_LAMINA / im.width);
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * esc);
        c.height = Math.round(im.height * esc);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        let calidad = 0.74, url = c.toDataURL("image/jpeg", calidad);
        while (url.length > TOPE_LAMINA && calidad > 0.35) { calidad -= 0.1; url = c.toDataURL("image/jpeg", calidad); }
        if (url.length > TOPE_LAMINA) return rechazar(new Error("La imagen sigue siendo muy pesada. Use una más pequeña o pegue una dirección web."));
        resolver(url);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function PanelAnuncios({ anuncios, setAnuncios, avisar }) {
  const BLANCA = { titulo: "", texto: "", enlace: "", img: "", activo: true };
  const [f, setF] = useState(BLANCA);
  const [edit, setEdit] = useState(null);
  const [cargando, setCargando] = useState(false);
  const fileRef = useRef(null);
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));

  async function elegirImagen(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setCargando(true);
    try { set("img", await reducirImagen(file)); }
    catch (err) { avisar(err.message, true); }
    setCargando(false);
  }

  function guardar() {
    if (!f.titulo.trim()) return avisar("La lámina necesita un título.", true);
    if (edit === null) setAnuncios((p) => [...p, { ...f, titulo: f.titulo.trim() }]);
    else setAnuncios((p) => p.map((x, i) => (i === edit ? { ...f, titulo: f.titulo.trim() } : x)));
    setF(BLANCA); setEdit(null);
    avisar(edit === null ? "Lámina agregada" : "Lámina actualizada");
  }

  function mover(i, d) {
    setAnuncios((p) => {
      const q = [...p], j = i + d;
      if (j < 0 || j >= q.length) return p;
      [q[i], q[j]] = [q[j], q[i]];
      return q;
    });
  }

  return (
    <div className="panel full" style={{ padding: 16 }}>
      <div className="eyebrow">Anuncios del encabezado · {anuncios.length}</div>
      <p style={{ fontSize: 12.5, color: T.muted, marginTop: 8, lineHeight: 1.6 }}>
        Las láminas rotan solas en la parte alta de la aplicación. Sirven para comunicados,
        recordatorios de plazos o campañas internas. La imagen se reduce a {ANCHO_LAMINA} px de ancho y
        queda guardada dentro del Excel; si prefiere no engordar el archivo, pegue la dirección web de
        una imagen alojada en la intranet o en SharePoint.
      </p>

      <div className="grid" style={{ marginTop: 14 }}>
        <Campo l="Título" req><input value={f.titulo} onChange={(e) => set("titulo", e.target.value)} placeholder="Cierre de vigencia 2026" /></Campo>
        <Campo l="Enlace (opcional)"><input value={f.enlace} onChange={(e) => set("enlace", e.target.value)} placeholder="https://…" /></Campo>
        <Campo l="Texto" full><textarea value={f.texto} onChange={(e) => set("texto", e.target.value)} placeholder="Una o dos líneas de contexto." /></Campo>
        <Campo l="Imagen de fondo" full>
          <div className="row">
            {f.img ? <img className="miniatura" src={f.img} alt="" /> : <div className="miniatura" />}
            <button className="btn mini" disabled={cargando} onClick={() => fileRef.current.click()}>
              {cargando ? "Procesando…" : "Elegir imagen"}
            </button>
            {f.img && <button className="btn ghost" onClick={() => set("img", "")}>Quitar imagen</button>}
            <input ref={fileRef} type="file" accept="image/*" onChange={elegirImagen} style={{ display: "none" }} />
          </div>
          <input style={{ marginTop: 9 }} value={f.img.startsWith("data:") ? "" : f.img}
            onChange={(e) => set("img", e.target.value)}
            placeholder={f.img.startsWith("data:") ? "Imagen incrustada en el Excel" : "…o pegue aquí una dirección web"} />
        </Campo>
      </div>
      <div className="row" style={{ marginTop: 14 }}>
        <button className="btn azul" onClick={guardar}>{edit === null ? "Agregar lámina" : "Guardar cambios"}</button>
        {edit !== null && <button className="btn ghost" onClick={() => { setF(BLANCA); setEdit(null); }}>Cancelar edición</button>}
      </div>

      <div style={{ marginTop: 18 }}>
        {anuncios.map((a, i) => (
          <div className="ufila" key={i}>
            {a.img ? <img className="miniatura" src={a.img} alt="" /> : <div className="miniatura" />}
            <div style={{ flex: 1, minWidth: 170 }}>
              <b>{a.titulo}</b>
              <div style={{ fontSize: 12, color: T.muted }}>{a.texto || "Sin texto"}</div>
            </div>
            <span className={"rol " + (a.activo ? "tec" : "pend")}>{a.activo ? "Visible" : "Oculta"}</span>
            <button className="btn ghost" onClick={() => mover(i, -1)} disabled={i === 0} title="Subir">↑</button>
            <button className="btn ghost" onClick={() => mover(i, 1)} disabled={i === anuncios.length - 1} title="Bajar">↓</button>
            <button className="btn ghost" onClick={() => setAnuncios((p) => p.map((x, k) => (k === i ? { ...x, activo: !x.activo } : x)))}>
              {a.activo ? "Ocultar" : "Mostrar"}
            </button>
            <button className="btn ghost" onClick={() => { setF({ ...a }); setEdit(i); }}>Editar</button>
            <button className="btn ghost" title="Quitar" onClick={() => { setAnuncios((p) => p.filter((_, k) => k !== i)); if (edit === i) { setF(BLANCA); setEdit(null); } }}>✕</button>
          </div>
        ))}
        {!anuncios.length && <p style={{ fontSize: 12.5, color: T.muted }}>
          Todavía no hay láminas. Mientras no exista ninguna visible, el encabezado no muestra el carrusel.
        </p>}
      </div>
    </div>
  );
}
