const ahora = () => new Date().toLocaleString("es-CO", { dateStyle: "short", timeStyle: "short" });

function toDate(v) {
  if (!v && v !== 0) return null;
  if (v instanceof Date && !isNaN(v)) return v;
  if (typeof v === "number") { const d = new Date(Math.round((v - 25569) * 86400000)); return isNaN(d) ? null : d; }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) return new Date(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2] - 1, +m[1]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
const dISO = (v) => iso(toDate(v));
const fmt = (v) => { const d = toDate(v); return d ? d.toLocaleDateString("es-CO", { day: "2-digit", month: "short", year: "2-digit" }) : "—"; };
const dias = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);

/* ------------------- cumplimientos periódicos (mensuales) ----------------- */
/* Un cumplimiento periódico no tiene una fecha fija sino un día del mes. La
   fecha de vencimiento se calcula sola, y al registrar el cumplimiento se abre
   el ciclo siguiente para que la obligación no se pierda.                    */
const DIA_ULTIMO = "Último";

const esPeriodico = (r) => {
  const v = r && r.periodico;
  return v === true || norm(v).startsWith("s");
};

/* Día que corresponde en un mes concreto. Si se eligió el 31 y el mes tiene
   30, cae en el último día disponible: nunca se salta un ciclo.             */
function ocurrenciaEnMes(dia, anio, mes) {
  const ultimo = new Date(anio, mes + 1, 0).getDate();
  const d = String(dia) === DIA_ULTIMO ? ultimo : Math.min(Math.max(parseInt(dia, 10) || 1, 1), ultimo);
  return iso(new Date(anio, mes, d));
}

/* Próximo vencimiento contado desde hoy (o desde la fecha que se indique). */
function proximaFecha(dia, desde) {
  const b = toDate(desde) || hoy();
  const f = ocurrenciaEnMes(dia, b.getFullYear(), b.getMonth());
  return f < iso(b) ? ocurrenciaEnMes(dia, b.getFullYear(), b.getMonth() + 1) : f;
}

/* Vencimiento del ciclo siguiente al que acaba de cumplirse. */
function siguienteCiclo(dia, plazo) {
  const b = toDate(plazo) || hoy();
  return ocurrenciaEnMes(dia, b.getFullYear(), b.getMonth() + 1);
}

const rotuloDia = (dia) => (String(dia) === DIA_ULTIMO ? "último día del mes" : "día " + dia + " de cada mes");

/* ---------------- recordatorio diario y escala de urgencia ---------------- */
/* La antelación de los cumplimientos periódicos es fija: quince días antes del
   vencimiento la aplicación empieza a pedir el avance de lo que se lleva.   */
const AVISO_PERIODICO = 15;

/* Una sola escala manda el color, la carita y la velocidad del parpadeo. Al
   estar en un mismo sitio, la señal es coherente en la barra, en las tablas y
   en la ficha impresa: cuanto menos tiempo queda, más intensa se vuelve.    */
const ESCALA = [
  { n: 0, cara: "😄", c: T.ok, vel: 0, l: "Con holgura" },
  { n: 1, cara: "🙂", c: T.info, vel: 0, l: "En tiempo" },
  { n: 2, cara: "😐", c: T.warn, vel: 2.4, l: "Se acerca" },
  { n: 3, cara: "😟", c: "#E0741A", vel: 1.4, l: "Últimos días" },
  { n: 4, cara: "😰", c: T.bad, vel: 0.85, l: "Vence hoy" },
  { n: 5, cara: "😱", c: "#8E1B10", vel: 0.5, l: "Vencido" },
];

function urgencia(e) {
  if (!e || e.s === "resuelto") return ESCALA[0];
  const d = e.rest;
  if (d === null || d === undefined) return ESCALA[1];
  if (d < 0) return ESCALA[5];
  if (d === 0) return ESCALA[4];
  if (d <= 2) return ESCALA[3];
  if (d <= 7) return ESCALA[2];
  if (d <= AVISO_PERIODICO) return ESCALA[1];
  return ESCALA[0];
}

/* ----------------- recordatorio por correo al responsable ---------------- */
/* El correo se escribe en el requerimiento, no en el área: el recordatorio va
   a quien tiene asignada la tarea. Se abre en el cliente de correo del equipo
   con un enlace mailto, de modo que la persona revisa antes de enviar y no
   hace falta ni servidor ni librería nueva.                                 */
const CORREO_OK = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v || "").trim());

const fechaLarga = (v) => {
  const d = toDate(v);
  return d ? d.toLocaleDateString("es-CO", { day: "numeric", month: "long", year: "numeric" }) : "sin fecha";
};

/* Asunto y cuerpo salen de los mismos datos que muestra el semáforo, para que
   el correo diga exactamente lo que dice la pantalla.                       */
function textoRecordatorio(r, e, oficina, remitente) {
  const u = urgencia(e);
  const venc = e.s === "vencido";
  const asunto = (venc ? "VENCIDO · " : e.rest === 0 ? "VENCE HOY · " : "Recordatorio de cumplimiento · ")
    + (r.consecutivo || "") + " · " + String(r.asunto || "").slice(0, 70);

  const L = [];
  L.push("Cordial saludo.");
  L.push("");
  L.push(venc
    ? "Le recuerdo que el siguiente requerimiento a su cargo se encuentra VENCIDO:"
    : "Le recuerdo el siguiente requerimiento a su cargo:");
  L.push("");
  L.push("Consecutivo: " + (r.consecutivo || "—"));
  L.push("Asunto: " + (r.asunto || "—"));
  if (r.consec_doc) L.push("Documento de recibido: " + r.consec_doc);
  L.push("Área responsable: " + (r.area || "—"));
  L.push("Prioridad: " + (r.prioridad || "—"));
  L.push("Fecha plazo: " + fechaLarga(r.fecha_plazo));
  L.push("Situación: " + e.motivo);
  if (esPeriodico(r)) L.push("Cumplimiento periódico: " + rotuloDia(r.dia_mes) + ".");
  if (r.descripcion) { L.push(""); L.push("Detalle de la solicitud:"); L.push(String(r.descripcion)); }
  const av = lineasAvance(r);
  if (av.length) { L.push(""); L.push("Último avance reportado:"); L.push(av[av.length - 1]); }
  L.push("");
  L.push(venc
    ? "Agradezco informar hoy mismo el estado del cumplimiento y la fecha en que quedará atendido."
    : "Agradezco informar el avance o registrar el cumplimiento antes de la fecha indicada.");
  L.push("");
  L.push("—");
  L.push("Gestor de Cumplimientos · " + (oficina || "Sin definir"));
  L.push("Mensaje preparado por " + (remitente || "—") + " el " + fechaLarga(hoyISO()) + ".");

  return { asunto, cuerpo: L.join("\n"), urgente: u.n >= 4 };
}

function enlaceRecordatorio(r, e, oficina, remitente) {
  const t = textoRecordatorio(r, e, oficina, remitente);
  return "mailto:" + encodeURIComponent(String(r.correo_resp || "").trim())
    + "?subject=" + encodeURIComponent(t.asunto)
    + "&body=" + encodeURIComponent(t.cuerpo);
}

/* Se puede recordar cuando hay correo válido, sigue pendiente y el plazo ya
   entró en el umbral de alerta o se pasó.                                   */
function puedeRecordar(r, e, alerta) {
  if (String(r.estado) === "Resuelto") return false;
  if (!CORREO_OK(r.correo_resp)) return false;
  return e.rest !== null && e.rest !== undefined && e.rest <= (alerta || 3);
}

/* ------------------------- avances de un requerimiento ------------------- */
/* Se guardan como texto acumulado, una línea por reporte, dentro de la misma
   fila del Excel: no hace falta una hoja nueva y el histórico viaja con el
   registro a donde vaya.                                                    */
const lineasAvance = (r) => String((r && r.avances) || "").split("\n").map((s) => s.trim()).filter(Boolean);

function conAvance(r, texto, usuario) {
  const linea = hoyISO() + " · " + (usuario || "—") + " · " + String(texto).replace(/\s+/g, " ").trim();
  return { avances: [...lineasAvance(r), linea].join("\n"), fecha_avance: hoyISO() };
}

/* Día en que se abre la ventana de aviso: quince días antes del vencimiento. */
function ventanaAvance(r) {
  const p = toDate(r && r.fecha_plazo);
  if (!p) return "";
  const d = new Date(p);
  d.setDate(d.getDate() - AVISO_PERIODICO);
  return iso(d);
}

/* Un periódico pide avance cuando entró en la ventana y todavía no se ha
   reportado nada en este ciclo. Reportado el avance, deja de insistir.      */
function pideAvance(r, e) {
  if (!esPeriodico(r) || String(r.estado) === "Resuelto") return false;
  if (e.rest === null || e.rest === undefined || e.rest > AVISO_PERIODICO) return false;
  const v = ventanaAvance(r);
  const ult = dISO(r.fecha_avance);
  return !ult || (v && ult < v);
}

function evaluar(r, alerta) {
  const plazo = toDate(r.fecha_plazo);
  const rest = plazo ? dias(hoy(), plazo) : null;
  if (String(r.estado) === "Resuelto") {
    const at = toDate(r.fecha_atencion);
    const tarde = plazo && at && dias(plazo, at) > 0;
    return { s: "resuelto", motivo: tarde ? "Resuelto fuera de plazo" : "Resuelto en plazo", rest };
  }
  if (rest === null) return { s: "tiempo", motivo: "Sin fecha plazo", rest };
  if (rest < 0) return { s: "vencido", motivo: "Vencido hace " + Math.abs(rest) + " d", rest };
  if (rest <= alerta) return { s: "porvencer", motivo: rest === 0 ? "Vence hoy" : "Vence en " + rest + " d", rest };
  return { s: "tiempo", motivo: "Faltan " + rest + " d", rest };
}

function consecutivo(rows) {
  const y = new Date().getFullYear();
  const n = rows.reduce((mx, r) => {
    const m = String(r.consecutivo || "").match(new RegExp("^" + y + "-(\\d+)$"));
    return m ? Math.max(mx, +m[1]) : mx;
  }, 0);
  return y + "-" + String(n + 1).padStart(4, "0");
}

/* — control de funcionarios: no admite repetir si comparte nombre o apellido — */
const PARTICULAS = ["de", "del", "la", "las", "los", "san", "y", "da", "do"];
const partes = (n) => norm(n).replace(/[^a-z\s]/g, " ").split(/\s+/).filter((t) => t.length > 1 && !PARTICULAS.includes(t));
function choque(nuevo, lista) {
  const t = partes(nuevo);
  if (!t.length) return null;
  return lista.find((f) => partes(f).some((x) => t.includes(x))) || null;
}
const titulo = (s) => String(s).trim().replace(/\s+/g, " ").replace(/\S+/g, (w) => w[0].toUpperCase() + w.slice(1).toLowerCase());

/* ====================== acceso de administrador ========================== */
/* La clave nunca se guarda en texto plano: se compara su huella de 32 dígitos.
   Usuario y huella viajan en la hoja Configuración del Excel, así cada oficina
   puede tener la suya. Si el Excel no los trae, rigen estos valores.          */
const ADMIN_USUARIO = "Admin";
const ADMIN_HASH = "14b51b10befc07cad1da00389a5d70e2";
const INTENTOS_MAX = 5;
const BLOQUEO_SEG = 30;

function fnv(s, seed) {
  let h = seed >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function huella(usuario, clave) {
  const txt = String(usuario || "").trim().toLowerCase() + ":" + String(clave || "");
  return [0x811C9DC5, 0x1000193, 0x7FEB352D, 0x846CA68B]
    .map((sd) => ("0000000" + fnv(txt, sd).toString(16)).slice(-8)).join("");
}

/* ================= control de duplicados por similitud =================== */
/* Compara dos denominaciones y devuelve qué tanto se parecen, de 0 a 1, con el
   coeficiente de Dice sobre pares de letras. "Gestion Contractual" contra
   "Gestion de Contratos" da alto; "Redes" contra "Jefatura" da casi cero.     */
function bigramas(t) {
  const x = norm(t).replace(/[^a-z0-9]/g, "");
  const b = [];
  for (let i = 0; i < x.length - 1; i++) b.push(x.slice(i, i + 2));
  return b;
}
function similitud(a, b) {
  const A = bigramas(a), B = bigramas(b);
  if (!A.length || !B.length) return norm(a) === norm(b) ? 1 : 0;
  const restante = [...B];
  let comunes = 0;
  A.forEach((g) => { const i = restante.indexOf(g); if (i >= 0) { comunes++; restante.splice(i, 1); } });
  /* Dice: qué tanto se parecen en conjunto.
     Contención: si la más corta está contenida en la más larga, como
     "Redes" dentro de "Redes y Comunicaciones", también es duplicado. */
  const dice = (2 * comunes) / (A.length + B.length);
  const contencion = comunes / Math.min(A.length, B.length);
  return Math.max(dice, contencion >= 0.9 ? contencion : 0);
}
const UMBRAL_SIMILITUD = 0.5;
function choqueArea(nueva, lista) {
  for (const a of lista) {
    const s = similitud(nueva, a);
    if (s >= UMBRAL_SIMILITUD) return { area: a, pct: Math.round(s * 100) };
  }
  return null;
}
/* La misma comparación, para cualquier catálogo. Devuelve el valor parecido y
   el porcentaje, o null si no choca con nada. */
function choqueCat(nuevo, lista) {
  let mejor = null;
  for (const v of lista) {
    const s = similitud(nuevo, v);
    if (s >= UMBRAL_SIMILITUD && (!mejor || s > mejor.s)) mejor = { s, valor: v, pct: Math.round(s * 100) };
  }
  return mejor;
}

/* Los cuatro catálogos que crecen con el uso.
   [clave interna, encabezado en el Excel, campo del registro, texto del botón] */
const CATALOGOS = [
  ["solicitantes", "Solicitante", "solicitante", "Agregar un solicitante"],
  ["tipos_req", "Tipo de requerimiento", "tipo_req", "Agregar un tipo de requerimiento"],
  ["medios", "Medio de recepción", "medio", "Agregar un medio de recepción"],
  ["areas", "Área responsable", "area", "Agregar un área responsable"],
];
const ETIQ_CAT = {};
CATALOGOS.forEach(([k, l]) => (ETIQ_CAT[k] = l));

/* ===================== sello de integridad de los datos ================== */
/* Resume todos los registros en una huella. Se guarda en la hoja Configuración
   al escribir y se vuelve a calcular al abrir: si no coincide, alguien editó el
   Excel por fuera de la aplicación.                                          */
/* El sello se calcula sobre las columnas originales. Los campos añadidos
   después (la periodicidad) quedan fuera a propósito: si entraran, cualquier
   archivo creado con una versión anterior daría una falsa alarma de
   manipulación la primera vez que se abre con la versión nueva.             */
const FUERA_SELLO = ["periodico", "dia_mes", "avances", "fecha_avance", "correo_resp", "ultimo_aviso"];
const COLS_SELLO = COLS.filter(([k]) => !FUERA_SELLO.includes(k));

function selloDatos(rs) {
  const txt = rs.map((r) => COLS_SELLO.map(([k]) => String(r[k] ?? "").trim()).join("\u0001")).join("\u0002");
  return [0x811C9DC5, 0x1000193, 0x7FEB352D, 0x846CA68B]
    .map((sd) => ("0000000" + fnv(txt, sd).toString(16)).slice(-8)).join("");
}

/* ============================ almacén del handle ========================= */
const IDB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    return new Promise((res, rej) => {
      const q = indexedDB.open("gestor-cumplimientos", 1);
      q.onupgradeneeded = () => q.result.createObjectStore("kv");
      q.onsuccess = () => { this.db = q.result; res(q.result); };
      q.onerror = () => rej(q.error);
    });
  },
  async set(k, v) { const db = await this.open(); return new Promise((r, j) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = r; t.onerror = () => j(t.error); }); },
  async get(k) { const db = await this.open(); return new Promise((r, j) => { const t = db.transaction("kv", "readonly").objectStore("kv").get(k); t.onsuccess = () => r(t.result); t.onerror = () => j(t.error); }); },
};

}

  border:1px solid #D9DEE6}
.gc .rep-barra i{display:block;height:100%}

/* Contenedor de impresión: al generar el PDF se clona el informe dentro de
   este bloque, colgado directamente del body. Así el resultado no depende de
   los márgenes, el fondo ni la estructura del resto de la aplicación.       */
#impresion{display:none}
#impresion.gc{background:#fff!important;min-height:0!important;padding:0!important;
  position:static!important;color:#101828}
#impresion.gc:before,#impresion.gc:after{display:none!important;content:none!important}
@media print{
  @page{size:A4 portrait;margin:13mm 11mm}
  html,body{background:#fff!important}
  body.modo-impresion > *{display:none!important}
  body.modo-impresion > #impresion{display:block!important}
  #impresion.gc{background:#fff!important;padding:0!important;min-height:0!important}
  #impresion.gc:before,#impresion.gc:after{display:none!important;content:none!important}
  #impresion .reporte{border:0;border-radius:0;padding:0;margin:0;max-width:none;width:auto;
    font-size:9.6px;line-height:1.42;color:#101828;
    font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif}
  #impresion .rep-cab img{width:52px;height:52px}
  #impresion .rep-cab h1{font-size:19px}
  #impresion .rep-kpi .v{font-size:18px}
  #impresion table.rep{font-size:8.8px}
  #impresion table.rep th,#impresion table.rep td{padding:4px 5px}
  #impresion .rep-sec h2{break-after:avoid;page-break-after:avoid}
  #impresion table.rep thead{display:table-header-group}
  #impresion table.rep tr{break-inside:avoid;page-break-inside:avoid}
  #impresion .rep-kpi,#impresion .rep-cab{break-inside:avoid;page-break-inside:avoid}
  #impresion .rep-dato,#impresion .rep-linea{break-inside:avoid;page-break-inside:avoid;font-size:8.8px}
  #impresion .rep-parr{font-size:8.8px}
  #impresion .rep-dato .k{font-size:8px}
  #impresion .rep-tabla{overflow:visible}
  #impresion .rep-pie{position:relative}
}
.gc .rep-tabla{overflow-x:auto;max-width:100%}
.gc table.rep .nw{white-space:nowrap}
.gc table.rep{table-layout:auto}

/* Parpadeo: discreto cuando falta tiempo, insistente cuando ya se agotó. */

/* =========================== búsqueda avanzada =========================== */
/* Permite localizar cualquier registro por asunto, por número de comunicado o
   por cualquier otra variable del sistema, combinando texto libre con filtros
   por estado, área, semáforo, prioridad, tipo, medio y rango de fechas.      */
const CAMPOS_BUSCA = [["todos", "Todos los campos"]]
  .concat(COLS.map(([k, l]) => [k, l]))
  .concat([["semaforo", "Semáforo"]]);

const CAMPOS_FECHA = [
  ["fecha_registro", "Fecha de registro"],
  ["fecha_plazo", "Fecha plazo"],
  ["fecha_atencion", "Fecha de atención"],
];

const BUSCA_VACIA = {
  texto: "", campo: "todos", estado: "todos", area: "todas", sem: "todos",
  prioridad: "todas", tipo: "todos", medio: "todos", oficina: "todas",
  campoFecha: "fecha_registro", desde: "", hasta: "",
};

function coincideBusqueda(x, b) {
  const r = x.r, e = x.e;
  const q = norm(b.texto).trim();
  if (q) {
    if (b.campo === "todos") {
      const hay = COLS.some(([k]) => norm(r[k]).includes(q)) || norm(SEM[e.s].l).includes(q);
      if (!hay) return false;
    } else if (b.campo === "semaforo") {
      if (!norm(SEM[e.s].l).includes(q)) return false;
    } else if (!norm(r[b.campo]).includes(q)) return false;
  }
  if (b.estado === "pendientes" && r.estado === "Resuelto") return false;
  if (b.estado === "resueltos" && r.estado !== "Resuelto") return false;
  if (b.area !== "todas" && r.area !== b.area) return false;
  if (b.sem !== "todos" && e.s !== b.sem) return false;
  if (b.prioridad !== "todas" && r.prioridad !== b.prioridad) return false;
  if (b.tipo !== "todos" && r.tipo_req !== b.tipo) return false;
  if (b.medio !== "todos" && r.medio !== b.medio) return false;
  if (b.oficina !== "todas" && r.oficina !== b.oficina) return false;
  if (b.desde || b.hasta) {
    const v = dISO(r[b.campoFecha]);
    if (!v) return false;
    if (b.desde && v < b.desde) return false;
    if (b.hasta && v > b.hasta) return false;
  }
  return true;
}

function hayFiltroActivo(b) {
  return Object.keys(BUSCA_VACIA).some((k) => b[k] !== BUSCA_VACIA[k]);
}

/* Resalta en amarillo la parte del texto que coincide con lo buscado. Si al
   quitar tildes cambia el largo de la cadena, se muestra sin resaltar para no
   cortar caracteres a la mitad.                                             */
function Resalta({ t, q }) {
  const s = String(t == null ? "" : t);
  const nq = norm(q || "").trim();
  if (!nq) return <>{s}</>;
  const ns = norm(s);
  if (ns.length !== s.length) return <>{s}</>;
  const partes = [];
  let i = 0, p, n = 0;
  while ((p = ns.indexOf(nq, i)) !== -1) {
    if (p > i) partes.push(s.slice(i, p));
    partes.push(<mark key={"m" + (n++)}>{s.slice(p, p + nq.length)}</mark>);
    i = p + nq.length;
  }
  partes.push(s.slice(i));
  return <>{partes}</>;
}

/* Exporta a Excel exactamente lo que quedó en pantalla tras filtrar. */
function exportarBusqueda(lista) {
  if (!window.XLSX) return { ok: false, msg: "La librería de Excel no está disponible." };
  if (!lista.length) return { ok: false, msg: "No hay resultados para exportar." };
  const datos = lista.map(({ r, e }) => {
    const o = {};
    COLS.forEach(([k, l]) => (o[l] = r[k] == null ? "" : r[k]));
    o["Semáforo"] = SEM[e.s].l;
    o["Días de atención"] = r.fecha_registro && r.fecha_atencion ? dias(r.fecha_registro, r.fecha_atencion) : "";
    return o;
  });
  const hoja = window.XLSX.utils.json_to_sheet(datos);
  const libro = window.XLSX.utils.book_new();
  window.XLSX.utils.book_append_sheet(libro, hoja, "Búsqueda");
  window.XLSX.writeFile(libro, "Busqueda_" + hoyISO() + ".xlsx");
  return { ok: true, msg: "Se exportaron " + lista.length + " registros." };
}

/* Desplegable de área que además permite crear una nueva sin salir de la
   pantalla. Se usa en los filtros y en el buscador.                        */
function SelectArea({ valor, onCambio, areas, onAgregarArea, textoTodas, ancho }) {
  const [modo, setModo] = useState("lista");
  const [txt, setTxt] = useState("");
  const [av, setAv] = useState("");
  const [listo, setListo] = useState("");

  function volver() { setModo("lista"); setTxt(""); setAv(""); }
  function agregar() {
    const r = onAgregarArea(txt);
    if (r && r.ok) {
      /* El área queda disponible para todos los registros, pero el filtro no
         cambia: una área recién creada aún no tiene requerimientos y la lista
         se vería vacía sin explicación. */
      setListo("Área agregada: " + titulo(txt));
      setTimeout(() => setListo(""), 4000);
      volver();
      return;
    }
    setAv((r && r.msg) || "No se pudo agregar.");
  }

  if (modo === "nueva") {
    return (
      <span style={{ display: "inline-flex", flexDirection: "column", gap: 4 }}>
        <span className="row" style={{ flexWrap: "nowrap", gap: 6, margin: 0 }}>
          <input autoFocus value={txt} style={{ width: 220 }} placeholder="Nombre del área responsable"
            onChange={(e) => { setTxt(e.target.value); setAv(""); }}
            onKeyDown={(e) => { if (e.key === "Enter") agregar(); if (e.key === "Escape") volver(); }} />
          <button className="btn mini azul" onClick={agregar}>Agregar</button>
          <button className="btn ghost" onClick={volver}>Cancelar</button>
        </span>
        {av && <span style={{ fontSize: 11.5, color: T.bad, maxWidth: 380 }}>{av}</span>}
      </span>
    );
  }
  return (
    <span style={{ display: "inline-flex", flexDirection: "column", gap: 3, width: ancho === "100%" ? "100%" : "auto" }}>
      <select style={{ width: ancho || "auto" }} value={valor}
        onChange={(e) => {
          if (e.target.value === "__nueva__") { setModo("nueva"); setAv(""); return; }
          onCambio(e.target.value);
        }}>
        <option value="todas">{textoTodas || "Todas las áreas"}</option>
        {(areas || []).map((a) => <option key={a} value={a}>{a}</option>)}
        <option value="__nueva__">＋ Agregar un área responsable</option>
      </select>
      {listo && <span style={{ fontSize: 11, color: T.ok }}>{listo}</span>}
    </span>
  );
}

  const [bq, setBq] = useState(BUSCA_VACIA);
  const [alterado, setAlterado] = useState(false);
  const [faltan, setFaltan] = useState(0);
  const [hayPrevio, setHayPrevio] = useState(null);
  const [handle, setHandle] = useState(null);
  const [archivo, setArchivo] = useState("");
  const [estadoG, setEstadoG] = useState("nada"); // nada | guardando | ok | pend | error
  const [ultimo, setUltimo] = useState("");
  const [toast, setToast] = useState(null);
  const [atender, setAtender] = useState(null);
  const [editar, setEditar] = useState(null);
  const [busca, setBusca] = useState("");
  const [fSem, setFSem] = useState("todos");
  const [fArea, setFArea] = useState("todas");
  /* Recordatorio del día: se puede ocultar, pero vuelve a aparecer la próxima
     vez que se abra la aplicación. No se guarda en ninguna parte. */
  const [avisoCerrado, setAvisoCerrado] = useState(false);
  const [verAvances, setVerAvances] = useState(false);
  const [verCorreos, setVerCorreos] = useState(false);
  const [fichaIni, setFichaIni] = useState("");
  const primera = useRef(true);
  const inputRef = useRef(null);
  /* Fecha de modificación del Excel en el momento en que lo leímos. Sirve para
     detectar que alguien más lo tocó antes de que nosotros escribamos encima. */
  const marcaArchivo = useRef(0);
  const [conflicto, setConflicto] = useState(false);
  const soporta = typeof window !== "undefined" && !!window.showSaveFilePicker;

  const avisar = (m, err) => { setToast({ m, err }); setTimeout(() => setToast(null), err ? 6000 : 2600); };

  /* toda acción relevante queda anotada en la hoja Bitácora del Excel */
  const anotar = (accion, consec, detalle) => setBitacora((p) => [...p, {
    fecha: ahora(), usuario: operador || "(sin identificar)", accion,
    consecutivo: consec || "", detalle: detalle || "",
  }].slice(-5000));

  /* ------------------------ reconectar al abrir ------------------------- */
  useEffect(() => {
    (async () => {
      try {
        const h = await IDB.get("archivo");
        if (h) {
          setHayPrevio(h.name);
          const p = await h.queryPermission({ mode: "readwrite" });
          setArchivo(h.name);
          if (p === "granted") { setHandle(h); await leer(h); setIniciado(true); }
          else setEstadoG("pend");
        }
      } catch (e) { /* sin idb disponible */ }
      setArrancando(false);
    })();
  }, []);

  /* la sesion de administrador se cierra sola tras 10 minutos sin actividad */
  useEffect(() => {
    if (!admin) return;
    let t;
    const reiniciar = () => {
      clearTimeout(t);
      t = setTimeout(() => {
        cerrarSesion("Por inactividad");
        avisar("Sesión cerrada por inactividad");
      }, 10 * 60 * 1000);
    };
    reiniciar();
    ["mousedown", "keydown", "touchstart"].forEach((e) => window.addEventListener(e, reiniciar));
    return () => {
      clearTimeout(t);
      ["mousedown", "keydown", "touchstart"].forEach((e) => window.removeEventListener(e, reiniciar));
    };
  }, [admin]);

  /* el nombre de la oficina tambien titula la ventana del navegador */
  useEffect(() => {
    document.title = oficina ? "Gestor de Cumplimientos - " + oficina : "Gestor de Cumplimientos";
  }, [oficina]);

  /* --------------------------- autoguardado ----------------------------- */
  useEffect(() => {
    if (primera.current) { primera.current = false; return; }
    if (!handle) { setEstadoG("pend"); return; }
    setEstadoG("guardando");
    const t = setTimeout(() => { escribir(handle, rows, funcs); }, 700);
    return () => clearTimeout(t);
  }, [rows, funcs, areas, cats, usuarios, anuncios, oficina, alerta, bitacora]);

  useEffect(() => {
    const h = (e) => { if (estadoG === "pend" && rows.length) { e.preventDefault(); e.returnValue = ""; } };
    window.addEventListener("beforeunload", h);
    return () => window.removeEventListener("beforeunload", h);
  }, [estadoG, rows.length]);

  /* ---------------------------- Excel I/O ------------------------------- */
  function construir(rs, fs, ofi, bit, ars) {
    const OFI = (ofi !== undefined ? ofi : oficina) || "Sin definir";
    const datos = rs.map((r) => {
      const e = evaluar(r, alerta);
      const o = {};
      COLS.forEach(([k, l]) => (o[l] = k === "oficina" ? (r.oficina || OFI) : (r[k] ?? "")));
      o["Días de atención"] = r.fecha_atencion && r.fecha_registro ? dias(r.fecha_registro, r.fecha_atencion) : "";
      o["Semáforo"] = SEM[e.s].l;
      return o;
    });
    const enc = [...COLS.map((c) => c[1]), ...CALC.map((c) => c[1])];
    const ws = XLSX.utils.json_to_sheet(datos, { header: enc });
    ws["!cols"] = [...COLS.map((c) => ({ wch: c[2] })), ...CALC.map((c) => ({ wch: c[2] }))];
    ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(datos.length, 1), c: enc.length - 1 } }) };
    ws["!freeze"] = { xSplit: 0, ySplit: 1 };

    const wsf = XLSX.utils.json_to_sheet(fs.map((f) => ({ Funcionario: f })), { header: ["Funcionario"] });
    wsf["!cols"] = [{ wch: 30 }];

    const ARS = ars || areas;
    const wsa = XLSX.utils.json_to_sheet(ARS.map((a) => ({ "Área responsable": a })), { header: ["Área responsable"] });
    wsa["!cols"] = [{ wch: 34 }];

    const res = ORDEN.map((s) => ({ Semáforo: SEM[s].l, Registros: rs.filter((r) => evaluar(r, alerta).s === s).length }));
    res.push({ Semáforo: "TOTAL", Registros: rs.length });
    ARS.forEach((a) => res.push({ Semáforo: "Área: " + a, Registros: rs.filter((r) => r.area === a).length }));
    const wsr = XLSX.utils.json_to_sheet(res);
    wsr["!cols"] = [{ wch: 26 }, { wch: 12 }];

    const wscfg = XLSX.utils.json_to_sheet([
      { "Parámetro": "Oficina", "Valor": OFI },
      { "Parámetro": "Días de alerta", "Valor": alerta },
      { "Parámetro": "Sello de integridad", "Valor": selloDatos(rs) },
      { "Parámetro": "Total de registros", "Valor": rs.length },
      { "Parámetro": "Usuarios registrados", "Valor": usuarios.length },
      { "Parámetro": "Última actualización", "Valor": new Date().toLocaleString("es-CO") },
      { "Parámetro": "Aplicación", "Valor": "Gestor de Cumplimientos v2.0" },
    ], { header: ["Parámetro", "Valor"] });
    wscfg["!cols"] = [{ wch: 24 }, { wch: 42 }];

    /* --- usuarios: la contraseña viaja solo como huella --- */
    const ENC_U = ["ID de usuario", "Nombre completo", "Rol", "Estado", "Clave (huella)", "Fecha de alta"];
    const wsu = XLSX.utils.json_to_sheet(usuarios.map((u) => ({
      "ID de usuario": u.id, "Nombre completo": u.nombre, "Rol": u.rol,
      "Estado": u.estado, "Clave (huella)": u.hash, "Fecha de alta": u.alta,
    })), { header: ENC_U });
    wsu["!cols"] = [{ wch: 18 }, { wch: 32 }, { wch: 16 }, { wch: 12 }, { wch: 36 }, { wch: 15 }];

    /* --- catálogos dinámicos --- */
    const filasCat = [];
    CATALOGOS.forEach(([clave, etiqueta]) => {
      (clave === "areas" ? ARS : (cats[clave] || [])).forEach((v) => filasCat.push({ "Catálogo": etiqueta, "Valor": v }));
    });
    const wsc = XLSX.utils.json_to_sheet(filasCat, { header: ["Catálogo", "Valor"] });
    wsc["!cols"] = [{ wch: 26 }, { wch: 46 }];

    /* --- anuncios del carrusel --- */
    const wsan = XLSX.utils.json_to_sheet(anuncios.map((a, i) => ({
      "Orden": i + 1, "Título": a.titulo, "Texto": a.texto, "Enlace": a.enlace,
      "Visible": a.activo ? "Sí" : "No",
      "Imagen": a.img && a.img.indexOf("data:") === 0 ? "(incrustada)" : (a.img || ""),
    })), { header: ["Orden", "Título", "Texto", "Enlace", "Visible", "Imagen"] });
    wsan["!cols"] = [{ wch: 7 }, { wch: 34 }, { wch: 58 }, { wch: 38 }, { wch: 9 }, { wch: 46 }];

    /* Una celda de Excel no admite más de 32.767 caracteres, así que la imagen
       incrustada se guarda partida en trozos y se rearma al leer. */
    const TROZO = 30000;
    const filasImg = [];
    anuncios.forEach((a, i) => {
      if (!a.img || a.img.indexOf("data:") !== 0) return;
      for (let p = 0; p * TROZO < a.img.length; p++)
        filasImg.push({ "Orden": i + 1, "Parte": p + 1, "Datos": a.img.slice(p * TROZO, (p + 1) * TROZO) });
    });
    const wsim = XLSX.utils.json_to_sheet(filasImg, { header: ["Orden", "Parte", "Datos"] });
    wsim["!cols"] = [{ wch: 7 }, { wch: 7 }, { wch: 60 }];

    const wsb = XLSX.utils.json_to_sheet(
      (bit || bitacora).map((b) => ({
        "Fecha y hora": b.fecha, "Usuario": b.usuario, "Acción": b.accion,
        "Consecutivo": b.consecutivo, "Detalle": b.detalle,
      })),
      { header: ["Fecha y hora", "Usuario", "Acción", "Consecutivo", "Detalle"] }
    );
    wsb["!cols"] = [{ wch: 20 }, { wch: 26 }, { wch: 26 }, { wch: 14 }, { wch: 52 }];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, HOJA);
    XLSX.utils.book_append_sheet(wb, wsr, "Resumen");
    XLSX.utils.book_append_sheet(wb, wscfg, "Configuración");
    XLSX.utils.book_append_sheet(wb, wsf, "Funcionarios");
    XLSX.utils.book_append_sheet(wb, wsa, "Áreas");
    XLSX.utils.book_append_sheet(wb, wsc, "Catálogos");
    XLSX.utils.book_append_sheet(wb, wsu, "Usuarios");
    XLSX.utils.book_append_sheet(wb, wsan, "Anuncios");
    XLSX.utils.book_append_sheet(wb, wsim, "Anuncios-Imagen");
    XLSX.utils.book_append_sheet(wb, wsb, "Bitácora");
    return wb;
  }

  async function escribir(h, rs, fs, ofi, bit, ars, forzar) {
    try {
      /* ¿Cambió el archivo desde que lo cargamos? Si otro equipo guardó primero,
         escribir aquí borraría su trabajo sin que nadie se enterara. */
      if (!forzar && marcaArchivo.current) {
        try {
          const previo = await h.getFile();
          if (previo.lastModified && previo.lastModified > marcaArchivo.current + 2000) {
            setConflicto(true);
            setEstadoG("pend");
            avisar("El Excel cambió por fuera. No se guardó para no borrar el trabajo de otra persona.", true);
            return;
          }
        } catch (e) { /* si no se puede consultar, se sigue como antes */ }
      }
      const wb = construir(rs, fs, ofi, bit, ars);
      const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      const w = await h.createWritable();
      await w.write(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
      await w.close();
      try { const post = await h.getFile(); marcaArchivo.current = post.lastModified || 0; } catch (e) {}
      setConflicto(false);
      setEstadoG("ok");
      setUltimo(new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" }));
    } catch (e) {
      setEstadoG("error");
      avisar("No se pudo escribir en el Excel. Verifica que no esté abierto en Excel y vuelve a vincularlo.", true);
    }
  }

  async function leer(h) {
    try {
      const f = await h.getFile();
      marcaArchivo.current = f.lastModified || 0;
      setConflicto(false);
      const wb = XLSX.read(new Uint8Array(await f.arrayBuffer()), { type: "array", cellDates: true });
      const hj = wb.SheetNames.includes(HOJA) ? HOJA : wb.SheetNames[0];
      const data = XLSX.utils.sheet_to_json(wb.Sheets[hj], { defval: "", raw: false, cellDates: true });
      const porLabel = {};
      COLS.forEach(([k, l]) => (porLabel[norm(l)] = k));
      porLabel[norm("Consecutivo del documento recibido")] = "consec_doc";
      const rs = data.map((d) => {
        const o = {}; COLS.forEach(([k]) => (o[k] = ""));
        Object.entries(d).forEach(([c, v]) => {
          const k = porLabel[norm(c)];
          if (!k) return;
          o[k] = k === "fecha_plazo" || k === "fecha_atencion" ? dISO(v) : v;
        });
        if (!o.estado) o.estado = o.fecha_atencion ? "Resuelto" : "Pendiente";
        return o;
      }).filter((o) => String(o.asunto || o.consecutivo || "").trim());
      let ofiLeida = "", selloPrevio = "", totalPrevio = null, adminViejo = "", hashViejo = "";
      const hcfg = wb.SheetNames.find((x) => norm(x) === norm("Configuración"));
      if (hcfg) {
        XLSX.utils.sheet_to_json(wb.Sheets[hcfg], { defval: "" }).forEach((f) => {
          const p = norm(f["Parámetro"] || f["Parametro"] || "");
          const v = String(f["Valor"] ?? "").trim();
          if (p === "oficina" && v && v !== "Sin definir") ofiLeida = v;
          if (p === "dias de alerta" && v !== "" && !isNaN(+v)) setAlerta(Math.max(0, +v));
          if (p === "usuario administrador" && v) adminViejo = v;
          if (p.indexOf("clave administrador") === 0 && /^[0-9a-f]{32}$/.test(v)) hashViejo = v;
          if (p === "sello de integridad" && /^[0-9a-f]{32}$/.test(v)) selloPrevio = v;
          if (p === "total de registros" && v !== "" && !isNaN(+v)) totalPrevio = +v;
        });
      }
      // respaldo: si no hay hoja de configuración, se toma de la columna Oficina
      if (!ofiLeida) {
        const f = rs.find((r) => String(r.oficina || "").trim());
        if (f) ofiLeida = String(f.oficina).trim();
      }
      if (ofiLeida) setOficina(ofiLeida);
      let fs = [];
      if (wb.SheetNames.includes("Funcionarios"))
        fs = XLSX.utils.sheet_to_json(wb.Sheets["Funcionarios"], { defval: "" }).map((x) => String(x.Funcionario || "").trim()).filter(Boolean);
      if (!fs.length) fs = [...new Set(rs.map((r) => String(r.resuelto_por || "").trim()).filter(Boolean))];

      let ars = [];
      const hare = wb.SheetNames.find((x) => norm(x) === norm("Áreas"));
      if (hare) ars = XLSX.utils.sheet_to_json(wb.Sheets[hare], { defval: "" })
        .map((x) => String(x["Área responsable"] || x["Area responsable"] || "").trim()).filter(Boolean);
      if (!ars.length) ars = [...new Set(rs.map((r) => String(r.area || "").trim()).filter(Boolean))].sort();
      setAreas(ars);

      /* ---------------------------- catálogos ---------------------------- */
      const nc = { solicitantes: [], tipos_req: [], medios: [] };
      const hcat = wb.SheetNames.find((x) => norm(x) === norm("Catálogos"));
      if (hcat) {
        XLSX.utils.sheet_to_json(wb.Sheets[hcat], { defval: "" }).forEach((fila) => {
          const et = norm(fila["Catálogo"] || fila["Catalogo"] || "");
          const v = String(fila["Valor"] || "").trim();
          if (!v) return;
          const c = CATALOGOS.find(([, l]) => norm(l) === et);
          if (c && c[0] !== "areas" && !nc[c[0]].some((x) => norm(x) === norm(v))) nc[c[0]].push(v);
        });
      } else {
        /* base anterior: se siembran con lo que ya usan los registros */
        [["solicitantes", "solicitante"], ["tipos_req", "tipo_req"], ["medios", "medio"]].forEach(([k, campo]) => {
          rs.forEach((r) => {
            const v = String(r[campo] || "").trim();
            if (v && !nc[k].some((x) => norm(x) === norm(v))) nc[k].push(v);
          });
        });
      }
      CAT.tipo_req.forEach((v) => { if (!nc.tipos_req.some((x) => norm(x) === norm(v))) nc.tipos_req.push(v); });
      CAT.medio.forEach((v) => { if (!nc.medios.some((x) => norm(x) === norm(v))) nc.medios.push(v); });
      setCats({ solicitantes: nc.solicitantes.sort(), tipos_req: nc.tipos_req.sort(), medios: nc.medios.sort() });

      /* ----------------------------- usuarios ---------------------------- */
      let us = [];
      const husr = wb.SheetNames.find((x) => norm(x) === norm("Usuarios"));
      if (husr) us = XLSX.utils.sheet_to_json(wb.Sheets[husr], { defval: "" }).map((u) => ({
        id: String(u["ID de usuario"] || "").trim().toLowerCase(),
        nombre: String(u["Nombre completo"] || "").trim(),
        rol: String(u["Rol"] || "Técnico").trim(),
        estado: String(u["Estado"] || "Activo").trim(),
        hash: String(u["Clave (huella)"] || "").trim(),
        alta: String(u["Fecha de alta"] || ""),
      })).filter((u) => u.id && /^[0-9a-f]{32}$/.test(u.hash));
      /* Bases de la versión anterior: el administrador único se convierte en usuario. */
      if (!us.length && hashViejo) us = [{
        id: String(adminViejo || ADMIN_USUARIO).trim().toLowerCase(),
        nombre: String(adminViejo || ADMIN_USUARIO), rol: "Administrador", estado: "Activo",
        hash: hashViejo, alta: new Date().toLocaleDateString("es-CO"),
      }];
      setUsuarios(us);

      /* ----------------------------- anuncios ---------------------------- */
      let ans = [];
      const hanu = wb.SheetNames.find((x) => norm(x) === norm("Anuncios"));
      if (hanu) {
        const trozos = {};
        const himg = wb.SheetNames.find((x) => norm(x) === norm("Anuncios-Imagen"));
        if (himg) XLSX.utils.sheet_to_json(wb.Sheets[himg], { defval: "" })
          .sort((a, b) => (+a.Orden - +b.Orden) || (+a.Parte - +b.Parte))
          .forEach((t) => { const o = +t.Orden; trozos[o] = (trozos[o] || "") + String(t.Datos || ""); });
        ans = XLSX.utils.sheet_to_json(wb.Sheets[hanu], { defval: "" }).map((a) => {
          const img = String(a["Imagen"] || "").trim();
          return {
            titulo: String(a["Título"] || a["Titulo"] || "").trim(),
            texto: String(a["Texto"] || "").trim(),
            enlace: String(a["Enlace"] || "").trim(),
            activo: norm(a["Visible"] || "Sí") !== "no",
            img: img === "(incrustada)" ? (trozos[+a["Orden"]] || "") : img,
          };
        }).filter((a) => a.titulo);
      }
      /* Base sin hoja de Anuncios: se siembra el carrusel de ejemplo. */
      setAnuncios(hanu ? ans : anunciosIniciales());

      let bit = [];
      const hbit = wb.SheetNames.find((x) => norm(x) === norm("Bitácora"));
      if (hbit) bit = XLSX.utils.sheet_to_json(wb.Sheets[hbit], { defval: "" }).map((b) => ({
        fecha: String(b["Fecha y hora"] || ""), usuario: String(b["Usuario"] || ""),
        accion: String(b["Acción"] || ""), consecutivo: String(b["Consecutivo"] || ""),
        detalle: String(b["Detalle"] || ""),
      })).filter((b) => b.fecha || b.accion);

      /* verificación de integridad: ¿el Excel fue editado fuera de la aplicación? */
      const selloActual = selloDatos(rs);
      const manipulado = !!selloPrevio && selloPrevio !== selloActual;
      const faltantes = totalPrevio !== null ? totalPrevio - rs.length : 0;
      if (faltantes > 0) {
        bit = [...bit, { fecha: ahora(), usuario: "(sistema)", accion: "Alerta de registros faltantes",
          consecutivo: "", detalle: "El archivo tenía " + totalPrevio + " registros y ahora tiene " + rs.length +
            ". Faltan " + faltantes + ". Recupere una versión anterior desde el historial de OneDrive o SharePoint." }];
      } else if (manipulado) {
        bit = [...bit, { fecha: ahora(), usuario: "(sistema)", accion: "Alerta de integridad",
          consecutivo: "", detalle: "Los registros no coinciden con el sello guardado: el archivo fue modificado fuera de la aplicación." }];
      }
      setFaltan(faltantes > 0 ? faltantes : 0);
      setAlterado(manipulado);
      setBitacora(bit);
      primera.current = true;
      setRows(rs); setFuncs(fs); setEstadoG("ok"); setUltimo(new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" }));
      if (faltantes > 0) avisar("Atención: faltan " + faltantes + " registros respecto al último guardado. Revise la hoja Bitácora.", true);
      else if (manipulado) avisar("Atención: el Excel fue modificado fuera de la aplicación. Revise la hoja Bitácora.", true);
      else avisar("Base cargada: " + rs.length + " registros");
    } catch (e) {
      avisar("No se pudo leer el archivo. ¿Es el Excel del gestor?", true);
    }
  }

  async function crearBase(nombreOficina) {
    const n = titulo(nombreOficina);
    setOficina(n);
    if (!soporta) {
      setIniciado(true);
      avisar("Este navegador no permite guardado automático. Use Chrome o Edge, o guarde con el botón Descargar copia.", true);
      return;
    }
    try {
      const h = await window.showSaveFilePicker({
        suggestedName: "Cumplimientos - " + n + ".xlsx",
        types: [{ description: "Libro de Excel", accept: { "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"] } }],
      });
      setHandle(h); setArchivo(h.name);
      try { await IDB.set("archivo", h); } catch (e) {}
      setAnuncios(anunciosIniciales());
      await escribir(h, [], [], n);
      setIniciado(true);
      avisar("Base creada para " + n);
    } catch (e) {
      if (e.name !== "AbortError") avisar("No se pudo crear el archivo.", true);
    }
  }

  async function abrirBase() {
    if (!soporta) { inputRef.current.click(); setIniciado(true); return; }
    try {
      const [h] = await window.showOpenFilePicker({
        types: [{ description: "Libro de Excel", accept: { "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"] } }],
      });
      const p = await h.requestPermission({ mode: "readwrite" });
      if (p !== "granted") return avisar("Se necesita permiso de escritura para guardar solo.", true);
      setHandle(h); setArchivo(h.name);
      try { await IDB.set("archivo", h); } catch (e) {}
      await leer(h);
      setIniciado(true);
    } catch (e) { if (e.name !== "AbortError") avisar("No se pudo abrir el archivo.", true); }
  }

  async function reconectarBase() {
    try {
      const h = await IDB.get("archivo");
      if (!h) return abrirBase();
      const p = await h.requestPermission({ mode: "readwrite" });
      if (p !== "granted") return avisar("Permiso denegado.", true);
      setHandle(h); setArchivo(h.name); await leer(h); setIniciado(true);
    } catch (e) { abrirBase(); }
  }

  async function vincularNuevo() {
    if (!soporta) return descargar();
    try {
      const h = await window.showSaveFilePicker({
        suggestedName: "Gestor de Cumplimientos.xlsx",
        types: [{ description: "Libro de Excel", accept: { "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"] } }],
      });
      setHandle(h); setArchivo(h.name);
      try { await IDB.set("archivo", h); } catch (e) {}
      await escribir(h, rows, funcs);
      avisar("Excel vinculado. Desde ahora se guarda solo.");
    } catch (e) { if (e.name !== "AbortError") avisar("No se pudo vincular el archivo.", true); }
  }

  async function vincularExistente() {
    if (!soporta) { inputRef.current.click(); return; }
    try {
      const [h] = await window.showOpenFilePicker({
        types: [{ description: "Libro de Excel", accept: { "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"] } }],
      });
      const p = await h.requestPermission({ mode: "readwrite" });
      if (p !== "granted") return avisar("Se necesita permiso de escritura para guardar solo.", true);
      setHandle(h); setArchivo(h.name);
      try { await IDB.set("archivo", h); } catch (e) {}
      await leer(h);
    } catch (e) { if (e.name !== "AbortError") avisar("No se pudo abrir el archivo.", true); }

  async function reconectar() {

      const h = await IDB.get("archivo");
      if (!h) return vincularExistente();
      const p = await h.requestPermission({ mode: "readwrite" });
      if (p !== "granted") return avisar("Permiso denegado.", true);

  function descargar() {
    try {
      XLSX.writeFile(construir(rows, funcs), (archivo || "Gestor de Cumplimientos").replace(/\.xlsx$/i, "") + ".xlsx");
      setEstadoG("ok"); avisar("Excel descargado");
    } catch (e) { avisar("El navegador bloqueó la descarga.", true); }
  }

  function abrirSuelto(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = (ev) => {
      const fake = { getFile: async () => new Blob([ev.target.result]) };
      fake.getFile = async () => ({ arrayBuffer: async () => ev.target.result });
      setArchivo(f.name);
      leer(fake);
    };
    fr.readAsArrayBuffer(f);
    e.target.value = "";
  }

  /* ----------------------------- operaciones ---------------------------- */
  function nuevoRegistro(d) {
    const c = consecutivo(rows);
    setRows((p) => [...p, { ...d, oficina, consecutivo: consecutivo(p), fecha_registro: ahora(),
      estado: "Pendiente", registrado_por: operador, modificado: ahora() + " · " + operador }]);
    anotar("Creó registro", c, d.asunto || "");
    avisar("Registro " + c + " guardado");
  }
  function guardarRespuesta(i, d) {
    const orig = rows[i];
    const repite = orig && esPeriodico(orig) && orig.dia_mes;
    const sigFecha = repite ? siguienteCiclo(orig.dia_mes, orig.fecha_plazo) : "";
    /* El consecutivo se calcula aquí y no dentro del actualizador de estado:
       React puede diferir esa función y el número llegaría vacío a la bitácora. */
    const sigConsec = repite ? consecutivo(rows) : "";

    setRows((p) => {
      const base = p.map((r, k) => (k === i ? { ...r, ...d, estado: "Resuelto", modificado: ahora() + " · " + operador } : r));
      if (!repite) return base;
      /* El ciclo siguiente hereda el encargo pero nace limpio: sin respuesta,
         sin fecha de atención y con su propio consecutivo. */
      base.push({
        oficina: orig.oficina || oficina,
        consecutivo: sigConsec,
        fecha_registro: ahora(),
        tipo_req: orig.tipo_req, medio: orig.medio, consec_doc: "",
        solicitante: orig.solicitante, asunto: orig.asunto, descripcion: orig.descripcion,
        area: orig.area, prioridad: orig.prioridad,
        fecha_plazo: sigFecha, periodico: "Sí", dia_mes: orig.dia_mes,
        estado: "Pendiente", fecha_atencion: "", tipo_resp: "", consec_resp: "",
        desc_resp: "", resuelto_por: "",
        registrado_por: operador,
        modificado: ahora() + " · " + operador + " (ciclo automático)",
      });
      return base;
    });

    anotar("Registró cumplimiento", orig && orig.consecutivo, d.tipo_resp || "");
    setAtender(null);
    if (repite) {
      anotar("Abrió el ciclo siguiente", sigConsec, "Periódico: " + rotuloDia(orig.dia_mes) + ". Vence " + fmt(sigFecha));
      avisar("Cumplimiento registrado. Se abrió el ciclo siguiente, vence " + fmt(sigFecha));
    } else {
      avisar("Cumplimiento registrado");
    }
  }
  function actualizar(i, d) {
    setRows((p) => p.map((r, k) => (k === i ? { ...r, ...d, modificado: ahora() + " · " + operador } : r)));
    anotar("Editó registro", d.consecutivo, d.asunto || "");
    setEditar(null);
  }

  /* Avance de un cumplimiento: no cierra nada, solo deja constancia fechada de
     cómo va. Mientras haya avance del ciclo, el recordatorio deja de insistir. */
  function registrarAvance(i, texto) {
    const t = String(texto || "").trim();
    if (!t) return;
    const orig = rows[i];
    setRows((p) => p.map((r, k) => (k === i
      ? { ...r, ...conAvance(r, t, operador), modificado: ahora() + " · " + operador } : r)));
    anotar("Reportó avance", orig && orig.consecutivo, t.slice(0, 180));
    avisar("Avance registrado en " + ((orig && orig.consecutivo) || "el requerimiento"));
  }

  /* Queda constancia de que se preparó el recordatorio. El envío lo hace la
     persona desde su cliente de correo; aquí solo se anota la fecha. */
  function marcarRecordado(i) {
    const orig = rows[i];
    if (!orig) return;
    const sello = ahora();
    setRows((p) => p.map((r, k) => (k === i ? { ...r, ultimo_aviso: sello } : r)));
    anotar("Preparó recordatorio por correo", orig.consecutivo, orig.correo_resp || "");
    avisar("Recordatorio abierto en el correo para " + (orig.correo_resp || "el responsable"));
  }

  /* Desde el recordatorio se salta al buscador ya filtrado por ese semáforo. */
  function irASemaforo(s) {
    setBq({ ...BUSCA_VACIA, estado: "pendientes", sem: s });
    setTab("buscar");
  }

  /* Abre la sección Reportes con la ficha de ese requerimiento ya elegida. */
  function verFicha(consec) {
    setFichaIni(consec || "");
    setTab("reportes");
  }
  function reabrir(i) {
    setRows((p) => p.map((r, k) => (k === i ? { ...r, estado: "Pendiente", modificado: ahora() + " · " + operador } : r)));
    anotar("Reabrió requerimiento", rows[i] && rows[i].consecutivo, "");
    avisar("Requerimiento reabierto");
  }
  function cambiarClave(actual, nueva, confirma) {
    if (!sesion) return { ok: false, msg: "No hay sesión activa." };
    const yo = usuarios.find((u) => u.id === sesion.id);
    if (!yo || huella(sesion.id, actual) !== yo.hash) return { ok: false, msg: "La contraseña actual no coincide." };
    if (String(nueva).length < 6) return { ok: false, msg: "La nueva contraseña debe tener al menos 6 caracteres." };
    if (nueva !== confirma) return { ok: false, msg: "La confirmación no coincide con la nueva contraseña." };
    setUsuarios((p) => p.map((u) => (u.id === sesion.id ? { ...u, hash: huella(sesion.id, nueva) } : u)));
    anotar("Cambió su contraseña", "", sesion.id);
    return { ok: true, msg: "Contraseña actualizada y guardada en el Excel." };
  }

  /* --------------------------- sesión de usuario ------------------------ */
  /* El primero que se registra manda: queda como administrador y entra de una.
     Los siguientes quedan pendientes hasta que un administrador los apruebe. */
  function registrarUsuario(d) {
    const id = String(d.id || "").trim().toLowerCase();
    if (!/^[a-z0-9._-]{3,}$/.test(id))
      return { ok: false, msg: "El usuario debe tener 3 caracteres o más, y solo letras, números, punto, guion o guion bajo." };
    if (usuarios.some((u) => u.id === id)) return { ok: false, msg: "Ese usuario ya está registrado en esta base." };
    const nombre = titulo(d.nombre || "");
    if (nombre.length < 5) return { ok: false, msg: "Escriba el nombre completo." };
    if (String(d.clave || "").length < 6) return { ok: false, msg: "La contraseña debe tener al menos 6 caracteres." };
    if (d.clave !== d.conf) return { ok: false, msg: "La confirmación no coincide con la contraseña." };
    const primero = !usuarios.length;
    const u = {
      id, nombre, rol: primero ? "Administrador" : "Técnico",
      estado: primero ? "Activo" : "Pendiente", hash: huella(id, d.clave),
      alta: new Date().toLocaleDateString("es-CO"),
    };
    setUsuarios((p) => [...p, u]);
    setBitacora((p) => [...p, { fecha: ahora(), usuario: nombre, consecutivo: "",
      accion: primero ? "Creó el administrador de la base" : "Solicitó acceso", detalle: id }]);
    if (primero) {
      setSesion({ id, nombre, rol: "Administrador" });
      return { ok: true, admin: true, msg: "" };
    }
    return { ok: true, msg: "Solicitud registrada. Un administrador debe aprobarla antes de su primer ingreso." };
  }

  function entrarUsuario(idBruto, clave) {
    const id = String(idBruto || "").trim().toLowerCase();
    const u = usuarios.find((x) => x.id === id);
    if (!u || u.hash !== huella(id, clave)) return { ok: false, msg: "Usuario o contraseña incorrectos." };
    if (u.estado === "Pendiente") return { ok: false, msg: "Su solicitud todavía no ha sido aprobada por un administrador." };
    setSesion({ id: u.id, nombre: u.nombre, rol: u.rol });
    setBitacora((p) => [...p, { fecha: ahora(), usuario: u.nombre, accion: "Inició sesión",
      consecutivo: "", detalle: u.rol + (archivo ? " · " + archivo : "") }]);
    return { ok: true };
  }

  function cerrarSesion(motivo) {
    if (sesion) setBitacora((p) => [...p, { fecha: ahora(), usuario: sesion.nombre,
      accion: "Cerró sesión", consecutivo: "", detalle: motivo || "" }]);
    setSesion(null);
    setTab("registro");
  }

  function aprobarUsuario(id, rol) {
    setUsuarios((p) => p.map((u) => (u.id === id ? { ...u, rol, estado: "Activo" } : u)));
    anotar("Aprobó el acceso de un usuario", "", id + " como " + rol);
    avisar("Acceso aprobado para " + id);
  }
  function rechazarUsuario(id) {
    setUsuarios((p) => p.filter((u) => u.id !== id));
    anotar("Rechazó una solicitud de acceso", "", id);
    avisar("Solicitud rechazada");
  }
  function cambiarRol(id, rol) {
    setUsuarios((p) => p.map((u) => (u.id === id ? { ...u, rol } : u)));
    anotar("Cambió el rol de un usuario", "", id + " ahora es " + rol);
  }
  function quitarUsuario(id) {
    setUsuarios((p) => p.filter((u) => u.id !== id));
    anotar("Retiró un usuario", "", id);
    avisar("Usuario retirado");
  }

  /* --------------------------- catálogos dinámicos ---------------------- */
  /* Una sola regla para solicitantes, tipos, medios y áreas:
       coincidencia exacta ignorando mayúsculas y tildes -> reutiliza la que hay
       parecido por encima del umbral, sin forzar        -> bloquea y pregunta
       forzado o sin parecido                            -> lo crea            */
  function listaCat(clave) { return clave === "areas" ? areas : (cats[clave] || []); }

  function resolverCat(clave, bruto, forzar) {
    const n = titulo(bruto);
    if (n.length < 2) return { ok: false, msg: "Escriba la denominación completa." };
    const lista = listaCat(clave);
    const exacta = lista.find((v) => norm(v) === norm(n));
    if (exacta) return { ok: true, valor: exacta, existente: true };
    if (!forzar) {
      const c = choqueCat(n, lista);
      if (c) return { ok: false, similar: c,
        msg: "«" + n + "» se parece un " + c.pct + " % a «" + c.valor + "», que ya está registrado. " +
             "¿Seguro que es un registro distinto?" };
    }
    if (clave === "areas") setAreas((p) => [...p, n].sort());
    else setCats((p) => ({ ...p, [clave]: [...(p[clave] || []), n].sort() }));
    anotar("Agregó al catálogo", "", ETIQ_CAT[clave] + ": " + n + (forzar ? " (confirmado pese a la coincidencia)" : ""));
    return { ok: true, valor: n, nueva: true };
  }

  function agregarArea(nombre) {
    const n = titulo(nombre);
    if (n.length < 3) return { ok: false, msg: "Escriba la denominación del área (mínimo 3 letras)." };
    const c = choqueArea(n, areas);
    if (c) return { ok: false, msg: "«" + n + "» se parece un " + c.pct + " % a «" + c.area + "». No se agregó para evitar áreas duplicadas." };
    setAreas((p) => [...p, n].sort());
    anotar("Creó área responsable", "", n);
    return { ok: true, msg: "Área agregada: " + n };
  }

  function quitarArea(a) {
    const usadas = rows.filter((r) => String(r.area || "").trim() === a).length;
    if (usadas) return { ok: false, msg: "No se puede quitar: hay " + usadas + " registros en esa área." };
    setAreas((p) => p.filter((x) => x !== a));
    anotar("Quitó área responsable", "", a);
    return { ok: true, msg: "Área retirada: " + a };
  }

  function agregarFunc(nombre) {
    const n = titulo(nombre);
    if (!n) return { ok: false, msg: "Escribe el nombre completo." };
    const c = choque(n, funcs);
    if (c) return { ok: false, msg: "Ya existe «" + c + "» y coincide en un nombre o apellido. No se agregó." };
    setFuncs((p) => [...p, n].sort());
    return { ok: true, nombre: n };
  }

  /* ------------------------------ derivados ----------------------------- */
  const ev = useMemo(() => rows.map((r, i) => ({ i, r, e: evaluar(r, alerta) })), [rows, alerta]);
  /* Correos ya usados en el sistema: alimentan la lista sugerida del campo. */
  const correosConocidos = useMemo(
    () => [...new Set(rows.map((r) => String(r.correo_resp || "").trim()).filter(CORREO_OK))].sort(),
    [rows]);
  const pend = useMemo(() => ev.filter((x) => x.r.estado !== "Resuelto")
    .sort((a, b) => ORDEN.indexOf(a.e.s) - ORDEN.indexOf(b.e.s) || (a.e.rest ?? 9e9) - (b.e.rest ?? 9e9)), [ev]);
  const res = useMemo(() => ev.filter((x) => x.r.estado === "Resuelto")
    .sort((a, b) => String(b.r.fecha_atencion).localeCompare(String(a.r.fecha_atencion))), [ev]);
  const conteo = useMemo(() => { const c = { resuelto: 0, tiempo: 0, porvencer: 0, vencido: 0 }; ev.forEach((x) => c[x.e.s]++); return c; }, [ev]);
  const cumpl = rows.length ? Math.round((conteo.resuelto / rows.length) * 100) : 0;

  const filtrar = (lista, ignoraSem) => {
    const q = norm(busca);
    return lista.filter(({ r, e }) => {
      if (!ignoraSem && fSem !== "todos" && e.s !== fSem) return false;
      if (fArea !== "todas" && r.area !== fArea) return false;
      if (q && !COLS.some(([k]) => norm(r[k]).includes(q))) return false;
      return true;
    });
  };

  const porAprobar = usuarios.filter((u) => u.estado === "Pendiente").length;
  const secciones = [
    { k: "registro", ico: "✎", l: "Nuevo requerimiento", d: "Registrar uno nuevo y ver los pendientes", cnt: pend.length, urgente: conteo.vencido },
    { k: "cumplimiento", ico: "✓", l: "Cumplimiento", d: "Responder y cerrar lo pendiente", cnt: pend.length },
    { k: "resueltos", ico: "▦", l: "Resueltos", d: "Histórico de lo ya atendido", cnt: res.length },
    { k: "buscar", ico: "⌕", l: "Buscar", d: "Por asunto, comunicado o cualquier dato", cnt: rows.length },
    { k: "reportes", ico: "▤", l: "Reportes", d: "Informe ejecutivo en PDF", cnt: rows.length },
    { k: "tablero", ico: "◱", l: "Tablero", d: "Indicadores y semáforo", cnt: rows.length },
    { k: "bitacora", ico: "☰", l: "Bitácora", d: "Quién hizo qué y cuándo", cnt: bitacora.length },
    { k: "ajustes", ico: admin ? "⚙" : "🔒", l: "Ajustes", d: admin ? "Catálogos, usuarios y anuncios" : "Solo para administradores", urgente: admin ? porAprobar : 0 },
  ];

  const ledColor = { ok: "#3FBF7F", guardando: T.gold2, pend: "#F0A94A", error: "#FF6B5A", nada: "#8592A6" }[estadoG];
  const ledTexto = { ok: "Guardado " + ultimo, guardando: "Guardando…", pend: "Sin vincular", error: "Error al guardar", nada: "Sin vincular" }[estadoG];

  /* ---------------------------- pantalla de inicio ---------------------- */
  if (!iniciado) return (
    <div className="gc" style={{ "--fondo": "url(" + window.MARCA_FONDO + ")" }}>
      <style>{CSS}</style>
      <input ref={inputRef} type="file" accept=".xlsx,.xls" onChange={(e) => { abrirSuelto(e); setIniciado(true); }} style={{ display: "none" }} />
      <PantallaInicio
        arrancando={arrancando}
        soporta={soporta}
        hayPrevio={hayPrevio}
        onCrear={crearBase}
        onAbrir={abrirBase}
        onReconectar={reconectarBase}
      />
      {toast && <div className={"toast" + (toast.err ? " err" : "")}>{toast.m}</div>}
    </div>
  );

  /* ------------------------- ingresar o registrarse --------------------- */
  if (!sesion) return (
    <div className="gc" style={{ "--fondo": "url(" + window.MARCA_FONDO + ")" }}>
      <style>{CSS}</style>
      <Acceso usuarios={usuarios} oficina={oficina} onEntrar={entrarUsuario} onRegistrar={registrarUsuario} />
      {toast && <div className={"toast" + (toast.err ? " err" : "")}>{toast.m}</div>}
    </div>
  );

  /* -------------------------------- render ------------------------------ */
  return (
    <div className="gc" style={{ "--fondo": "url(" + window.MARCA_FONDO + ")" }}>
      <style>{CSS}</style>
      <input ref={inputRef} type="file" accept=".xlsx,.xls" onChange={abrirSuelto} style={{ display: "none" }} />

      <div className="rail">
        <div className="wrap">
          <div className="top">
            <div className="marca">
              <img src={window.MARCA} alt="Secretario Virtual Policial" />
              <div>
                <h1>Gestor de Cumplimientos</h1>
                <div className="sub">Control de comunicaciones y pendientes</div>
                <div className="oficina">{oficina || "Oficina sin definir"}</div>
              </div>
            </div>
            <div className="row">
              <div className="archivo" title={"Sesión de " + sesion.nombre}>
                <span className="led" style={{ background: admin ? T.gold2 : "#7FA9D8" }} />
                <span>{sesion.nombre} · {sesion.rol}</span>
              </div>
              <button className="btn claro mini" onClick={() => cerrarSesion("Manual")}>Salir</button>
              <div className="archivo" title={archivo || "Ningún Excel vinculado"}>
                <span className="led" style={{ background: ledColor }} />
                <span>{archivo ? archivo + " · " + ledTexto : "Sin Excel vinculado"}</span>
              </div>
              {handle ? (
                <button className="btn claro" onClick={() => escribir(handle, rows, funcs)}>Guardar ahora</button>
              ) : (
                <button className="btn oro" onClick={vincularExistente}>Vincular Excel</button>
              )}
            </div>
          </div>
          <AvisoDiario ev={ev} alerta={alerta} cerrado={avisoCerrado} setCerrado={setAvisoCerrado}
            onIr={irASemaforo} onAvances={() => setVerAvances(true)}
            onRecordatorios={() => setVerCorreos(true)} />
          <div className="row" style={{ marginTop: 14, marginBottom: 16, alignItems: "center", gap: 14 }}>
            <MenuPrincipal tab={tab} setTab={setTab} secciones={secciones} />
            <span className="aquiestas">{(secciones.find((x) => x.k === tab) || {}).l}</span>
          </div>
        </div>
      </div>

      <div className="wrap" style={{ paddingTop: 16 }}>
        {conflicto && (
          <div className="panel" style={{ padding: 16, marginBottom: 14, borderLeft: "4px solid " + T.bad }}>
            <div className="eyebrow" style={{ color: T.bad }}>Guardado detenido</div>
            <p style={{ fontSize: 13.5, lineHeight: 1.6, marginTop: 8 }}>
              Otra persona, u otro equipo, guardó cambios en <b>{archivo}</b> después de que usted
              lo abrió. Si escribe encima, el trabajo de esa persona se pierde y no queda rastro.
            </p>
            <p style={{ fontSize: 12.5, color: T.muted, lineHeight: 1.6, marginTop: 0 }}>
              Lo recomendable es recargar y volver a registrar lo que tenga sin guardar. Escriba
              encima solo si está seguro de que su copia es la buena.
            </p>
            <div className="row" style={{ marginTop: 12 }}>
              <button className="btn azul" onClick={() => leer(handle)}>Recargar desde el archivo</button>
              <button className="btn ghost" onClick={() => {
                anotar("Escribió sobre cambios externos", "", archivo || "");
                escribir(handle, rows, funcs, undefined, undefined, undefined, true);
              }}>Escribir encima de todos modos</button>
            </div>
          </div>
        )}
        <Carrusel laminas={anuncios.filter((a) => a.activo && a.titulo)} />
        {!handle && (
          <div className="panel" style={{ padding: 14, marginBottom: 14, borderLeft: "3px solid " + T.gold, display: "flex", gap: 12, flexWrap: "wrap", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{ fontSize: 13 }}>
              <b>Vincula el Excel una sola vez</b> y cada cambio se guarda solo en ese archivo.
              {!soporta && <span style={{ color: T.bad }}> Tu navegador no permite el guardado automático: usa Chrome o Edge.</span>}
            </div>
            <div className="row">
              <button className="btn azul" onClick={vincularExistente}>Abrir Excel existente</button>
              <button className="btn" onClick={vincularNuevo}>Crear Excel nuevo</button>
              <button className="btn ghost" onClick={reconectar}>Reconectar el anterior</button>
            </div>
          </div>
        )}

        {tab === "registro" && (
          <FormRegistro onGuardar={nuevoRegistro} pend={pend} cats={cats} areas={areas} onCat={resolverCat}
            onAtender={(x) => { setAtender(x); setTab("cumplimiento"); }} onEditar={setEditar}
            onFicha={verFicha} onRecordar={() => setVerCorreos(true)} correos={correosConocidos} alerta={alerta} />
        )}

        {tab === "cumplimiento" && (
          <Cumplimiento pend={pend} funcs={funcs} onAgregarFunc={agregarFunc} onGuardar={guardarRespuesta} atender={atender} setAtender={setAtender} />
        )}

        {tab === "resueltos" && (
          <>
            <Filtros {...{ busca, setBusca, fArea, setFArea, fSem, setFSem, total: res.length, mostrados: filtrar(res, true).length, sinSem: true, areas, agregarArea }} />
            <TablaResueltos filas={filtrar(res, true)} onReabrir={reabrir} onEditar={setEditar} />
          </>
        )}

        {tab === "buscar" && (
          <Buscador {...{ ev, bq, setBq, areas, cats, oficina, agregarArea,
            onEditar: setEditar, avisar, onFicha: verFicha,
            onAtender: (x) => { setAtender(x); setTab("cumplimiento"); },
            onReabrir: reabrir }} />
        )}

        {tab === "reportes" && (
          <Reportes {...{ ev, areas, oficina, sesion, alerta, avisar, bitacora, fichaIni, setFichaIni }} />
        )}

        {tab === "tablero" && <Tablero {...{ conteo, cumpl, rows, ev, cumplAlerta: alerta, setTab, setFSem, areas }} />}

        {tab === "bitacora" && <VistaBitacora bitacora={bitacora} />}

        {tab === "ajustes" && (admin ? (
          <Ajustes {...{ alerta, setAlerta, oficina, setOficina, funcs, setFuncs, agregarFunc, areas, agregarArea, quitarArea,
            handle, archivo, vincularExistente, vincularNuevo, descargar, escribir, rows, soporta, avisar,
            cats, onCat: resolverCat, usuarios, sesion, aprobarUsuario, rechazarUsuario, cambiarRol, quitarUsuario,
            anuncios, setAnuncios, cambiarClave,
            onSalir: () => { cerrarSesion("Manual"); avisar("Sesión cerrada"); } }} />
        ) : (
          <div className="panel" style={{ padding: 30, maxWidth: 520, margin: "10px auto", textAlign: "center" }}>
            <div style={{ fontSize: 30, lineHeight: 1 }}>🔒</div>
            <h2 style={{ fontSize: 20, margin: "12px 0 8px", color: T.navy }}>Solo para administradores</h2>
            <p style={{ fontSize: 13.5, color: T.muted, lineHeight: 1.6, margin: 0 }}>
              Su cuenta tiene rol de <b>{sesion.rol}</b>. Los catálogos, los usuarios, los anuncios y la
              vinculación del archivo los administra el jefe de la dependencia.
            </p>
          </div>
        ))}
      </div>

      {editar !== null && editar !== undefined && (
        <ModalEditar x={editar} cats={cats} areas={areas} correos={correosConocidos} onCat={resolverCat}
          onCancel={() => setEditar(null)} onSave={(d) => actualizar(editar.i, d)} />
      )}
      {verAvances && (
        <ModalAvances lista={ev.filter((x) => pideAvance(x.r, x.e))} alerta={alerta}
          onCerrar={() => setVerAvances(false)} onGuardar={registrarAvance} />
      )}
      {verCorreos && (
        <ModalRecordatorios lista={ev.filter((x) => puedeRecordar(x.r, x.e, alerta))}
          oficina={oficina} sesion={sesion}
          onCerrar={() => setVerCorreos(false)} onEnviar={marcarRecordado} />
      )}
      <AvatarFlotante pend={pend} alerta={alerta} onIr={irASemaforo}
        onAvances={() => setVerAvances(true)} onRecordatorios={() => setVerCorreos(true)}
        onVerFicha={verFicha} />
      {toast && <div className={"toast" + (toast.err ? " err" : "")}>{toast.m}</div>}
    </div>
  );
}

/* ============================ vista: registro ============================ */
const BLANCO = { tipo_req: "Solicitud", medio: "Correo", consec_doc: "", solicitante: "", asunto: "", descripcion: "", area: "", correo_resp: "", prioridad: "Media", fecha_plazo: "", periodico: "", dia_mes: "" };

function FormRegistro({ onGuardar, pend, cats, areas, correos, onCat, onAtender, onEditar, onFicha, onRecordar, alerta }) {
  const [f, setF] = useState(BLANCO);
  const [err, setErr] = useState("");
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  function guardar() {
    if (!f.asunto.trim()) return setErr("El asunto es obligatorio.");
    if (!String(f.area || "").trim()) return setErr("Elija el área responsable.");
    setErr("");
    onGuardar({ ...f });
    setF(BLANCO);
  }
  return (
    <>
      <div className="panel" style={{ marginBottom: 16 }}>
        <div style={{ background: T.navy2, color: "#fff", padding: "11px 16px", borderRadius: "7px 7px 0 0", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
          <h2 style={{ fontSize: 17, textTransform: "uppercase", letterSpacing: ".03em" }}>Nuevo requerimiento</h2>
          <span style={{ fontSize: 11, color: "#A9B7C9", fontFamily: "'IBM Plex Mono',monospace" }}>
            Consecutivo y fecha se asignan al guardar
          </span>
        </div>
        <div style={{ padding: 16 }}>
          <div className="grid">
            <SelectorCatalogo etiqueta="Tipo de requerimiento" valor={f.tipo_req} onCambio={(v) => set("tipo_req", v)}
              opciones={cats.tipos_req} onAgregar={(v, fz) => onCat("tipos_req", v, fz)} nuevoTexto="Agregar un tipo de requerimiento" />
            <SelectorCatalogo etiqueta="Medio de recepción" valor={f.medio} onCambio={(v) => set("medio", v)}
              opciones={cats.medios} onAgregar={(v, fz) => onCat("medios", v, fz)} nuevoTexto="Agregar un medio de recepción" />
            <Campo l="Consecutivo de Recibido"><input value={f.consec_doc} onChange={(e) => set("consec_doc", e.target.value)} placeholder="N.º de oficio, GEPOL o radicado" /></Campo>
            <SelectorCatalogo etiqueta="Solicitante" valor={f.solicitante} onCambio={(v) => set("solicitante", v)}
              opciones={cats.solicitantes} onAgregar={(v, fz) => onCat("solicitantes", v, fz)}
              nuevoTexto="Agregar un solicitante"
              pista={cats.solicitantes.length ? cats.solicitantes.length + " solicitantes registrados." : "Todavía no hay solicitantes registrados."} />
            <SelectorCatalogo etiqueta="Área responsable" req valor={f.area} onCambio={(v) => { set("area", v); setErr(""); }}
              opciones={areas} onAgregar={(v, fz) => onCat("areas", v, fz)} nuevoTexto="Agregar un área responsable"
              pista={areas.length ? areas.length + " áreas registradas." : "Registre la primera área de la dependencia."} />
            <CampoCorreo valor={f.correo_resp} onCambio={(v) => set("correo_resp", v)} correos={correos} />
            <Campo l="Asunto" req full><input value={f.asunto} onChange={(e) => set("asunto", e.target.value)} placeholder="Resumen corto del requerimiento" /></Campo>
            <Campo l="Descripción de la solicitud" full><textarea value={f.descripcion} onChange={(e) => set("descripcion", e.target.value)} placeholder="Detalle de lo solicitado, radicados relacionados, condiciones…" /></Campo>
            <Campo l="Prioridad"><select value={f.prioridad} onChange={(e) => set("prioridad", e.target.value)}>{CAT.prioridad.map((o) => <option key={o}>{o}</option>)}</select></Campo>
            <PlazoCumplimiento f={f} set={set} full />
          </div>
          {err && <p style={{ color: T.bad, fontSize: 12.5, marginTop: 12, marginBottom: 0 }}>{err}</p>}
          <div className="row" style={{ marginTop: 16 }}>
            <button className="btn oro" onClick={guardar}>Guardar registro</button>
            <button className="btn ghost" onClick={() => { setF(BLANCO); setErr(""); }}>Limpiar</button>
          </div>
        </div>
      </div>

      <div className="eyebrow" style={{ marginBottom: 8 }}>Pendientes · {pend.length}</div>
      <div className="panel" style={{ overflow: "auto", maxHeight: "62vh" }}>
        <table>
          <thead><tr><th>Estado</th><th>Consecutivo</th><th>Doc. recibido</th><th>Asunto</th><th>Área</th><th>Plazo</th><th></th></tr></thead>
          <tbody>
            {pend.map(({ i, r, e }) => (
              <tr key={i}>
                <td><Chip e={e} /></td>
                <td><span className="mono" style={{ fontSize: 12 }}>{r.consecutivo}</span>
                  <div style={{ fontSize: 10.5, color: T.muted, marginTop: 3 }}>{r.fecha_registro}</div></td>

}

/* ========================== vista: cumplimiento ========================== */
function Cumplimiento({ pend, funcs, onAgregarFunc, onGuardar, atender, setAtender }) {
  if (atender) return <FormRespuesta x={atender} funcs={funcs} onAgregarFunc={onAgregarFunc} onCancel={() => setAtender(null)} onGuardar={(d) => onGuardar(atender.i, d)} />;
  return (
    <>
      <div className="panel" style={{ padding: 14, marginBottom: 14, borderLeft: "3px solid " + T.navy2, fontSize: 13 }}>
        Selecciona el requerimiento que vas a cerrar. Se registra la respuesta y la fila se marca como resuelta en el mismo Excel.
      </div>
      <div className="panel" style={{ overflow: "auto", maxHeight: "72vh" }}>
        <table>
          <thead><tr><th>Estado</th><th>Consecutivo</th><th>Doc. recibido</th><th>Asunto</th><th>Solicitante</th><th>Área</th><th>Plazo</th><th></th></tr></thead>
          <tbody>
            {pend.map(({ i, r, e }) => (
              <tr key={i}>
                <td><Chip e={e} /></td>
                <td className="mono" style={{ fontSize: 12 }}>{r.consecutivo}</td>
                <td className="mono" style={{ fontSize: 12 }}>{r.consec_doc || "—"}</td>
                <td style={{ maxWidth: 320, fontWeight: 600 }}>{r.asunto}
                  <div style={{ fontSize: 11, color: T.muted, fontWeight: 400, marginTop: 2 }}>{r.descripcion ? String(r.descripcion).slice(0, 90) : ""}</div></td>
                <td style={{ fontSize: 12, color: T.muted }}>{r.solicitante || "—"}</td>
                <td style={{ fontSize: 12 }}>{r.area || "—"}</td>
                <td className="mono" style={{ fontSize: 12 }}>{fmt(r.fecha_plazo)}

                <td style={{ textAlign: "right" }}><button className="btn mini oro" onClick={() => setAtender({ i, r })}>Registrar respuesta</button></td>
              </tr>

            {!pend.length && <tr><td colSpan={8} style={{ padding: 30, textAlign: "center", color: T.muted }}>Todo al día: no hay pendientes por resolver.</td></tr>}

        </table>
